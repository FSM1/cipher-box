# v2 PR gate (blueprint/testing.md). Jobs cover what exists: the cargo
# workspace (incl. the core KAT manifest job, native + WASM) and the TS
# workspace stubs. The remaining PR-gate suites (packages/client browser
# suite, contract suite, Windows adapter tests, migration drift, e2e smoke
# slice) land with their code and must block merges in a named job the day
# they land (law 1).
name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

  typecheck:
    name: Typecheck
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checker
        run: pnpm typecheck

  test:
    name: Test
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

  api-unit:
    name: API Unit
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API unit suite
        run: pnpm --filter @cipherbox/api test

  migration-drift:
    name: Migration Drift
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run committed migrations against a fresh database
        run: pnpm --filter @cipherbox/api migration:run

      - name: Assert entities and migrations agree
        working-directory: apps/api
        run: |
          set +e
          OUTPUT="$(pnpm migration:generate src/migrations/DriftCheck 2>&1)"
          set -e

          if echo "$OUTPUT" | grep -q "No changes in database schema were found"; then
            echo "No entity/migration drift detected."
            exit 0
          fi

          echo "::error::Entity/migration drift detected - entities define schema not covered by committed migrations."
          echo "$OUTPUT"
          if ls src/migrations/*DriftCheck*.ts 1>/dev/null 2>&1; then
            echo ""
            echo "Generated drift migration:"
            cat src/migrations/*DriftCheck*.ts
          fi
          echo ""
          echo "Fix: pnpm --filter @cipherbox/api migration:generate src/migrations/<Name> and commit the result."
          exit 1

  openapi-freshness:
    name: OpenAPI Freshness
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the OpenAPI document
        run: pnpm --filter @cipherbox/api openapi:generate

      - name: Assert the committed artifact is fresh
        run: |
          if ! git diff --exit-code -- apps/api/openapi.json; then
            echo "::error::apps/api/openapi.json is stale - run 'pnpm --filter @cipherbox/api openapi:generate' and commit the result."
            exit 1
          fi

  cargo-linux:
    name: Cargo Check & Test (Linux)
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Cargo fmt
        run: cargo fmt --all --check

      # The desktop shell is excluded from the workspace-wide jobs: compiling
      # Tauri needs webkit2gtk system deps on Linux, and the desktop-build job
      # owns its check/clippy/build on all three platforms.
      - name: Cargo clippy
        run: cargo clippy --workspace --exclude cipherbox-desktop --all-targets -- -D warnings

      - name: Cargo test (workspace)
        run: cargo test --workspace --exclude cipherbox-desktop

  engine:
    name: Engine Tests
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      # Engine unit tests plus every seam conformance kit executed against
      # its in-memory fake (the test-kit feature activates via the crate's
      # self dev-dependency).
      - name: Engine tests and seam conformance kits
        run: cargo test -p cipherbox-engine

  # The WASM parity gate. Runs the core KAT + property suite in three shapes —
  # native, wasm32-wasip1 (libtest under wasmtime), and the browser-shaped
  # wasm32-unknown-unknown (wasm-bindgen-test → Node) that exercises the
  # residual u64/BigInt and getrandom-`crypto.getRandomValues` boundary risks
  # (blueprint/core.md, blueprint/web-client.md) — plus the crates/wasm facade
  # boundary tests and the single ES-module artifact build.
  core-kats:
    name: Core KATs (native + WASM)
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: core-kats-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: core-kats-cargo-

      - name: Add wasm targets
        run: rustup target add wasm32-wasip1 wasm32-unknown-unknown

      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'

      # wasm-bindgen-test-runner drives the wasm32-unknown-unknown tests in
      # Node and must match the locked wasm-bindgen version exactly (a schema
      # mismatch fails the run); derive the version from Cargo.lock. The binary
      # is cached in ~/.cargo/bin: skip the install when the cached binary
      # already matches (a bare `cargo install` errors "already exists" on a
      # cache hit), otherwise install with --force to overwrite a stale one.
      - name: Install wasm-bindgen-cli (matching Cargo.lock)
        run: |
          WB_VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "wasm-bindgen ${WB_VERSION}"
          if wasm-bindgen --version 2>/dev/null | grep -qw "${WB_VERSION}"; then
            echo "wasm-bindgen-cli ${WB_VERSION} already present (cache hit); skipping install"
          else
            cargo install wasm-bindgen-cli --version "${WB_VERSION}" --locked --force
          fi

      - name: KAT vectors fresh (committed generator is the only writer)
        run: |
          cargo run -p cipherbox-core --example kat_gen
          git diff --exit-code -- crates/core/kat
          test -z "$(git status --porcelain -- crates/core/kat)"

      - name: Core suite (native)
        run: cargo test -p cipherbox-core

      - name: Core suite (WASM, wasm32-wasip1 under wasmtime)
        run: cargo test -p cipherbox-core --target wasm32-wasip1

      # Browser-shaped leg: the KAT + property suite under Node via
      # wasm-bindgen-test. Count parity with the native run is the anti-vacuity
      # backstop (the test-file `#[test]` shadow routes both to this harness).
      - name: Core KAT + property suite (WASM, wasm32-unknown-unknown)
        run: cargo test -p cipherbox-core --target wasm32-unknown-unknown --test kat_manifest --test codec_props

      # The crates/wasm facade boundary tests (u64/BigInt, getrandom wiring,
      # command/event shapes) run under the same Node harness.
      - name: WASM facade boundary tests (wasm32-unknown-unknown)
        run: cargo test -p cipherbox-wasm --target wasm32-unknown-unknown

      # The single wasm-bindgen ES module and its generated .d.ts contract must
      # build (blueprint/web-client.md); packages/client hosts and fingerprints
      # it later.
      - name: Build the wasm-bindgen ES module and .d.ts
        run: |
          cargo build -p cipherbox-wasm --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir target/wasm-pkg --out-name cipherbox_wasm \
            target/wasm32-unknown-unknown/release/cipherbox_wasm.wasm
          test -f target/wasm-pkg/cipherbox_wasm.d.ts
          test -f target/wasm-pkg/cipherbox_wasm.js

  cargo-macos:
    name: Cargo Check & Test (macOS)
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Cargo check (workspace)
        run: cargo check --workspace --exclude cipherbox-desktop --all-targets

      - name: Cargo test (workspace)
        run: cargo test --workspace --exclude cipherbox-desktop

  cargo-windows:
    name: Cargo Check & Test (Windows)
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Cargo check (workspace)
        run: cargo check --workspace --exclude cipherbox-desktop --all-targets

      - name: Cargo test (workspace)
        run: cargo test --workspace --exclude cipherbox-desktop

  desktop-build:
    name: Desktop Build
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-cargo-

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo fmt (desktop shell)
        run: cargo fmt -p cipherbox-desktop --check

      - name: Cargo check (desktop shell)
        run: cargo check -p cipherbox-desktop --all-targets

      - name: Cargo clippy (desktop shell)
        run: cargo clippy -p cipherbox-desktop --all-targets -- -D warnings

      - name: Tauri build (unsigned, no bundle)
        run: pnpm --filter @cipherbox/desktop tauri build --no-bundle
