# v2 PR gate (blueprint/testing.md). This workflow is the caller: it detects
# what changed and hands each area to its own reusable workflow, so a check
# reads "Area / job". Every area ends in one stable `<Area> Result` context,
# which is what branch protection requires — an area skipped by its path filter
# still reports, and a real failure inside it still fails. A gate also fails
# when change detection failed, which skips its area and would otherwise report
# a pass on a required context.
name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              # The TS suite pins MEDIA_WINDOW_BYTES against this manifest, so a
              # Rust-side chunk-size change must run it.
              - 'crates/engine/kat/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-api.yml'
              - '.github/workflows/ci-web.yml'
              - '.github/workflows/ci-desktop.yml'
              - '.github/actions/**'
            rust:
              - 'crates/**'
              - 'third-party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-rust.yml'
              - '.github/actions/**'
            web:
              - 'apps/web/**'
              - 'packages/auth-ui/**'
              - 'packages/client/**'
              - 'packages/login/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-web.yml'
              - '.github/actions/**'
            # What the smoke slice depends on *beyond* `web` — it drives the
            # browser against a live API and the hermetic record store. Its job
            # runs on `web || e2e`, so widening `web` widens the gate too.
            e2e:
              - 'apps/api/**'
              - 'tests/**'
              - 'tools/mock-ipns-routing/**'
              - '.github/workflows/web-e2e.yml'
            desktop:
              - 'apps/desktop/**'
              - 'packages/auth-ui/**'
              - 'packages/login/**'
              - 'third-party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-desktop.yml'

  repo:
    name: Repo
    permissions:
      contents: read
    uses: ./.github/workflows/ci-repo.yml
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  repo-result:
    name: Repo Result
    needs: repo
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the Repo area to pass or be skipped
        env:
          AREA_RESULT: ${{ needs.repo.result }}
        run: |
          echo "repo result: ${AREA_RESULT}"
          if [ "${AREA_RESULT}" = 'failure' ] || [ "${AREA_RESULT}" = 'cancelled' ]; then
            echo "::error::the Repo area ${AREA_RESULT}"
            exit 1
          fi

  api:
    name: API
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-api.yml
    with:
      ts: ${{ needs.changes.outputs.ts == 'true' }}

  api-result:
    name: API Result
    needs: [changes, api]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the API area to pass or be skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AREA_RESULT: ${{ needs.api.result }}
        run: |
          echo "changes result: ${CHANGES_RESULT}; api result: ${AREA_RESULT}"
          if [ "${CHANGES_RESULT}" != 'success' ]; then
            echo "::error::change detection ${CHANGES_RESULT}, so the API area never ran"
            exit 1
          fi
          if [ "${AREA_RESULT}" = 'failure' ] || [ "${AREA_RESULT}" = 'cancelled' ]; then
            echo "::error::the API area ${AREA_RESULT}"
            exit 1
          fi

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-rust.yml
    with:
      rust: ${{ needs.changes.outputs.rust == 'true' }}

  rust-result:
    name: Rust Result
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the Rust area to pass or be skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AREA_RESULT: ${{ needs.rust.result }}
        run: |
          echo "changes result: ${CHANGES_RESULT}; rust result: ${AREA_RESULT}"
          if [ "${CHANGES_RESULT}" != 'success' ]; then
            echo "::error::change detection ${CHANGES_RESULT}, so the Rust area never ran"
            exit 1
          fi
          if [ "${AREA_RESULT}" = 'failure' ] || [ "${AREA_RESULT}" = 'cancelled' ]; then
            echo "::error::the Rust area ${AREA_RESULT}"
            exit 1
          fi

  # The engine's browser artifact (blueprint/web-client.md "WASM packaging"),
  # built once per run and consumed by both the Web area's bundle and the smoke
  # slice, so the two are the same bytes by construction. It stays in the caller
  # for that reason: nesting it in the Web area would make the smoke slice wait
  # for the whole area. `Web Result` covers it.
  wasm-engine:
    name: Web Engine WASM
    needs: changes
    if: |
      needs.changes.outputs.web == 'true' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: ./.github/actions/wasm-bindgen-cli

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      # No `pnpm install`: the script this runs shells out to cargo and
      # wasm-bindgen and pulls in no npm dependency.
      - name: Build the engine WASM
        run: pnpm --filter @cipherbox/web run build:wasm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-engine-wasm
          path: apps/web/src/wasm
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web
    needs: [changes, wasm-engine]
    if: |
      !cancelled() &&
      (needs.changes.outputs.ts == 'true' || needs.changes.outputs.web == 'true' ||
       needs.changes.outputs.rust == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/ci-web.yml
    with:
      ts: ${{ needs.changes.outputs.ts == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}
      rust: ${{ needs.changes.outputs.rust == 'true' }}

  web-result:
    name: Web Result
    needs: [changes, wasm-engine, web]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the Web area to pass or be skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WASM_RESULT: ${{ needs.wasm-engine.result }}
          AREA_RESULT: ${{ needs.web.result }}
        run: |
          echo "changes result: ${CHANGES_RESULT}; wasm-engine result: ${WASM_RESULT}; web result: ${AREA_RESULT}"
          if [ "${CHANGES_RESULT}" != 'success' ]; then
            echo "::error::change detection ${CHANGES_RESULT}, so the Web area never ran"
            exit 1
          fi
          for r in "${WASM_RESULT}" "${AREA_RESULT}"; do
            if [ "$r" = 'failure' ] || [ "$r" = 'cancelled' ]; then
              echo "::error::the Web area $r"
              exit 1
            fi
          done

  desktop:
    name: Desktop
    needs: changes
    if: |
      needs.changes.outputs.ts == 'true' || needs.changes.outputs.desktop == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci-desktop.yml
    with:
      ts: ${{ needs.changes.outputs.ts == 'true' }}
      desktop: ${{ needs.changes.outputs.desktop == 'true' }}

  desktop-result:
    name: Desktop Result
    needs: [changes, desktop]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the Desktop area to pass or be skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AREA_RESULT: ${{ needs.desktop.result }}
        run: |
          echo "changes result: ${CHANGES_RESULT}; desktop result: ${AREA_RESULT}"
          if [ "${CHANGES_RESULT}" != 'success' ]; then
            echo "::error::change detection ${CHANGES_RESULT}, so the Desktop area never ran"
            exit 1
          fi
          if [ "${AREA_RESULT}" = 'failure' ] || [ "${AREA_RESULT}" = 'cancelled' ]; then
            echo "::error::the Desktop area ${AREA_RESULT}"
            exit 1
          fi

  # The live contract suite (blueprint/testing.md "The contract suite"): the
  # sdk-e2e descendant and the sole contract enforcement. It stands up the CI
  # stack — Postgres, Kubo, the promoted mock-ipns-routing /routing/v1 store,
  # and the real NestJS API (a second instance in production mode to assert
  # test-login is hard-blocked) — then runs the engine's hand-written API
  # client against it. Contract drift fails a test run, not a grep. It spans the
  # Rust client and the TypeScript API, so it belongs to neither area and keeps
  # its own stable result context.
  contract-suite:
    name: Contract Suite
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      ipfs:
        image: ipfs/kubo:v0.42.0
        ports:
          - 5001:5001
          - 8080:8080
        options: >-
          --health-cmd "ipfs id"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      NODE_ENV: test
      JWT_SECRET: contract-suite-jwt-secret
      # The hosted upload path pins to the CI Kubo service; a tiny per-account
      # quota lets a few-hundred-byte upload straddle the over-quota limit.
      KUBO_API_URL: http://localhost:5001
      QUOTA_DEFAULT_BYTES: '1024'
      # The client-presented secret must equal the API's TEST_LOGIN_SECRET.
      TEST_LOGIN_SECRET: contract-suite-secret
      # The whole suite logs in from one IP, so the per-IP auth bucket would
      # otherwise cap how many tests can exist. Only the test-mode
      # instance honors it; the production-mode one on 3100 refuses it, which
      # the suite asserts.
      THROTTLE_AUTH_LIMIT: '200'
      CONTRACT_API_URL: http://localhost:3000
      CONTRACT_API_PROD_URL: http://localhost:3100
      CONTRACT_TEST_LOGIN_SECRET: contract-suite-secret
      # The stack's gateway, so the suite can fetch back a block the ingress
      # pinned and prove it landed under the caller-computed address.
      CONTRACT_GATEWAY_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The contract crate is excluded from the Rust area's cargo jobs, so lint
      # it here.
      - name: Cargo fmt and clippy (contract crate)
        run: |
          cargo fmt -p cipherbox-contract --check
          cargo clippy -p cipherbox-contract --all-targets -- -D warnings

      - uses: ./.github/actions/mock-ipns-routing

      - name: Apply migrations to a fresh database
        run: pnpm --filter @cipherbox/api migration:run

      - name: Build the API
        run: pnpm --filter @cipherbox/api build

      # A deployed profile fails closed on every credential it will later need, so
      # the production-mode instance gets a placeholder for each. None is ever
      # redeemed: it serves the test-login rejection assertion alone, and the
      # signing key is generated here so no key material is committed.
      - name: Boot the API in test and production modes
        run: |
          node apps/api/dist/main.js > /tmp/api-test.log 2>&1 &
          NODE_ENV=production PORT=3100 \
            IDENTITY_JWT_PRIVATE_KEY="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | base64 -w0)" \
            GOOGLE_CLIENT_ID=contract-suite-google-client-id \
            MAIL_PROVIDER=sendgrid \
            SENDGRID_API_KEY=contract-suite-sendgrid-key \
            MAIL_FROM_ADDRESS=no-reply@contract-suite.invalid \
            node apps/api/dist/main.js > /tmp/api-prod.log 2>&1 &
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 http://localhost:3000/health \
            || { echo '--- test-mode API log ---'; cat /tmp/api-test.log; exit 1; }
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 http://localhost:3100/health \
            || { echo '--- production-mode API log ---'; cat /tmp/api-prod.log; exit 1; }

      - name: Run the live contract suite
        run: cargo test -p cipherbox-contract

  contract-suite-result:
    name: Contract Suite Result
    needs: [changes, contract-suite]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the contract suite to pass or be skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACT_SUITE_RESULT: ${{ needs.contract-suite.result }}
        run: |
          echo "changes result: ${CHANGES_RESULT}; contract-suite result: ${CONTRACT_SUITE_RESULT}"
          if [ "${CHANGES_RESULT}" != 'success' ]; then
            echo "::error::change detection ${CHANGES_RESULT}, so the contract suite never ran"
            exit 1
          fi
          if [ "${CONTRACT_SUITE_RESULT}" = 'failure' ] || [ "${CONTRACT_SUITE_RESULT}" = 'cancelled' ]; then
            echo "::error::contract-suite ${CONTRACT_SUITE_RESULT}"
            exit 1
          fi

  # The smoke slice consumes the same engine artifact the Web area's bundle
  # does, so it needs `wasm-engine` alone rather than the whole area. A failed
  # engine build leaves this running and failing at the download.
  web-e2e:
    name: Web E2E Smoke
    needs: [changes, wasm-engine]
    if: |
      !cancelled() &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.e2e == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/web-e2e.yml
    with:
      wasm-artifact: web-engine-wasm
      suite: smoke

  web-e2e-result:
    name: Web E2E Smoke Result
    needs: [changes, web-e2e]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the smoke slice to pass or be skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
        run: |
          echo "changes result: ${CHANGES_RESULT}; web-e2e result: ${WEB_E2E_RESULT}"
          if [ "${CHANGES_RESULT}" != 'success' ]; then
            echo "::error::change detection ${CHANGES_RESULT}, so the smoke slice never ran"
            exit 1
          fi
          if [ "${WEB_E2E_RESULT}" = 'failure' ] || [ "${WEB_E2E_RESULT}" = 'cancelled' ]; then
            echo "::error::web-e2e ${WEB_E2E_RESULT}"
            exit 1
          fi
