# v2 PR gate (blueprint/testing.md). Jobs cover what exists: the cargo
# workspace (incl. the core KAT manifest job, native + WASM), the TS
# workspace stubs, the live contract suite against the CI stack, and the web
# e2e smoke slice. The remaining PR-gate suites (Windows adapter tests, the
# cross-client timing scenario) land with their code and must block merges in
# a named job the day they land (law 1).
name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      e2e: ${{ steps.filter.outputs.e2e }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ts:
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              # The TS suite pins MEDIA_WINDOW_BYTES against this manifest, so a
              # Rust-side chunk-size change must run it.
              - 'crates/engine/kat/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            rust:
              - 'crates/**'
              - 'third-party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            web:
              - 'apps/web/**'
              - 'packages/client/**'
              - 'packages/login/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig*.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            # What the smoke slice depends on *beyond* `web` — it drives the
            # browser against a live API and the hermetic record store. Its job
            # runs on `web || e2e`, so widening `web` widens the gate too.
            e2e:
              - 'apps/api/**'
              - 'tests/**'
              - 'tools/mock-ipns-routing/**'
              - '.github/workflows/web-e2e.yml'
            desktop:
              - 'apps/desktop/**'
              - 'third-party/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      # The updater refuses any release its configured key did not sign, so a
      # pubkey that drifts from the CI signing secret ships an app that can
      # never update again. This is checked here rather than in Desktop Build
      # because a key rotation touches no path filter — and because the
      # signing key has no business in a job that runs the desktop crate's
      # build scripts.
      - name: Assert the updater pubkey matches the signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is unavailable to this run, so the updater key is unverifiable"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y minisign
          WORK=$(mktemp -d)
          # Tauri wraps both the public key and the signature file in base64;
          # minisign wants the unwrapped bytes.
          jq -er '.plugins.updater.pubkey' apps/desktop/src-tauri/tauri.conf.json \
            | base64 -d > "${WORK}/updater.pub"
          echo 'cipherbox updater key check' > "${WORK}/payload"
          # `exec`, not the package's `tauri` script: that wrapper appends a
          # `--config` the `signer` subcommand rejects.
          pnpm --filter @cipherbox/desktop exec tauri signer sign "${WORK}/payload"
          base64 -d < "${WORK}/payload.sig" > "${WORK}/payload.minisig"
          minisign -V -p "${WORK}/updater.pub" -m "${WORK}/payload" -x "${WORK}/payload.minisig"

  tracker-refs:
    name: Tracker Refs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: No source comment names a tracking issue
        run: node scripts/check-tracker-refs.mjs

  typecheck:
    name: Typecheck
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type checker
        run: pnpm typecheck

  test:
    name: Test
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web is built by `Web Bundle`, which has the engine WASM its bundle
      # embeds. `!cipher-box` drops the root project, whose own `build` script
      # would recurse back into every package.
      - name: Build packages
        run: pnpm --filter '!@cipherbox/web' --filter '!cipher-box' run build

  # The engine's browser artifact (blueprint/web-client.md "WASM packaging"),
  # built once per run. Every job that ships or exercises the browser engine
  # consumes this artifact, so a run's bundle and its e2e slice are the same
  # bytes by construction rather than by coincidence.
  wasm-engine:
    name: Web Engine WASM
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `target/release` is the host tree: under `--target wasm32-…` cargo puts
      # proc macros and build scripts there, so omitting it recompiles them on
      # every run. The native `target/<triple>` subtrees the cargo jobs cache
      # stay out — dead weight here, and a fourth full copy would push the
      # repo's other cargo caches out under LRU.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/wasm32-unknown-unknown
          key: wasm-engine-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            wasm-engine-cargo-
            main-wasm-cargo-

      - uses: ./.github/actions/wasm-bindgen-cli

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      # No `pnpm install`: the script this runs shells out to cargo and
      # wasm-bindgen and pulls in no npm dependency.
      - name: Build the engine WASM
        run: pnpm --filter @cipherbox/web run build:wasm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-engine-wasm
          path: apps/web/src/wasm
          if-no-files-found: error
          retention-days: 1

  # The bundle that fingerprints the engine artifact. It consumes the module
  # `wasm-engine` produced, so it carries no Rust toolchain at all.
  #
  # Gated on `lint` rather than the usual `!failure()`: branch protection
  # requires this context by name, and a skipped required context counts as a
  # pass. So a failed `wasm-engine` must leave this job running and failing at
  # the download, not skipped and green.
  web-bundle:
    name: Web Bundle
    needs: [changes, lint, wasm-engine]
    if: |
      !cancelled() && needs.lint.result == 'success' &&
      needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine-wasm
          path: apps/web/src/wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web bundle
        run: pnpm --filter @cipherbox/web run build:bundle

      - name: Bundle carries the fingerprinted engine artifact
        run: ls apps/web/dist/assets/cipherbox_wasm-*.js apps/web/dist/assets/cipherbox_wasm_bg-*.wasm

  api-unit:
    name: API Unit
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API unit suite
        run: pnpm --filter @cipherbox/api test

  migration-drift:
    name: Migration Drift
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run committed migrations against a fresh database
        run: pnpm --filter @cipherbox/api migration:run

      - name: Assert entities and migrations agree
        working-directory: apps/api
        run: |
          set +e
          OUTPUT="$(pnpm migration:generate src/migrations/DriftCheck 2>&1)"
          set -e

          if echo "$OUTPUT" | grep -q "No changes in database schema were found"; then
            echo "No entity/migration drift detected."
            exit 0
          fi

          echo "::error::Entity/migration drift detected - entities define schema not covered by committed migrations."
          echo "$OUTPUT"
          if ls src/migrations/*DriftCheck*.ts 1>/dev/null 2>&1; then
            echo ""
            echo "Generated drift migration:"
            cat src/migrations/*DriftCheck*.ts
          fi
          echo ""
          echo "Fix: pnpm --filter @cipherbox/api migration:generate src/migrations/<Name> and commit the result."
          exit 1

  # The first-class API integration suite (blueprint/testing.md law 1): the
  # real-Postgres concurrency/interleaving tests — registry register-vs-retire
  # phantom and duplicate-insert, mailbox pending-cap, and the advisory-lock
  # lock_timeout DoS guard — run against a live Postgres. They are named
  # `*.itest.ts`; this job owns them. Each test provisions its own
  # randomized throwaway database and drops only that one. NOT yet a required
  # check (a new required context deadlocks open PRs that predate it) — flip to
  # required after this lands on main and open PRs rebase.
  api-integration:
    name: API Integration (real Postgres)
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the API integration suite
        run: pnpm --filter @cipherbox/api test:integration

  openapi-freshness:
    name: OpenAPI Freshness
    needs: [changes, lint]
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate the OpenAPI document
        run: pnpm --filter @cipherbox/api openapi:generate

      - name: Assert the committed artifact is fresh
        run: |
          if ! git diff --exit-code -- apps/api/openapi.json; then
            echo "::error::apps/api/openapi.json is stale - run 'pnpm --filter @cipherbox/api openapi:generate' and commit the result."
            exit 1
          fi

  cargo-linux:
    name: Cargo Check & Test (Linux)
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-cargo-
            main-cargo-

      - name: Cargo fmt
        run: cargo fmt --all --check

      # The desktop shell is excluded from the workspace-wide jobs: compiling
      # Tauri needs webkit2gtk system deps on Linux, and the desktop-build job
      # owns its check/clippy/build on all three platforms. The contract crate
      # is excluded from the test run below (its tests need the live API stack)
      # and owns its own lint in the contract-suite job. The vendored fuser is
      # linted here and nowhere else — this is the only job on a target its
      # build script accepts — and excluded from the test run below: its one
      # upstream test mounts a real filesystem, and the FUSE Op Core job runs
      # the rest.
      - name: Cargo clippy
        run: cargo clippy --workspace --exclude cipherbox-desktop --exclude cipherbox-contract --all-targets -- -D warnings

      - name: Cargo test (workspace)
        run: cargo test --workspace --exclude cipherbox-desktop --exclude cipherbox-contract --exclude fuser

      # The Secret Service ships on Linux desktops but is absent from a bare
      # runner: gnome-keyring provides it, and an empty password unlocks the
      # throwaway login keyring the daemon creates.
      - name: Real OS keyring credential seam
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- bash -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p cipherbox-desktop-seams --test conformance -- --ignored
          '

  engine:
    name: Engine Tests
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-cargo-
            main-cargo-

      - name: Engine KAT vectors fresh (committed generator is the only writer)
        run: |
          cargo run -p cipherbox-engine --example kat_gen
          git diff --exit-code -- crates/engine/kat
          test -z "$(git status --porcelain -- crates/engine/kat)"

      # Engine unit tests, the content-DAG KAT suite, plus every seam
      # conformance kit executed against its in-memory fake (the test-kit
      # feature activates via the crate's self dev-dependency).
      - name: Engine tests and seam conformance kits
        run: cargo test -p cipherbox-engine

  # The `fuse-op-core` suite: every vfs operation driven against a real engine
  # on the in-memory seam fakes — no kernel, so it runs on any runner.
  fuse-op-core:
    name: FUSE Op Core
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-cargo-
            main-cargo-

      - name: FUSE operation-core suite
        run: cargo test -p cipherbox-fuse

      # The vendored fuser's socket-read patch travels with the regression test
      # blueprint/desktop.md commits to, and this is where that test fires. The
      # general cargo jobs exclude the crate, so this is its only gate. The one
      # upstream test that mounts a real filesystem is skipped: this job is
      # kernel-free by design.
      - name: Vendored fuser socket-read patch
        run: cargo test -p fuser -- --skip mnt::test::mount_unmount

  # The WASM parity gate. Runs the core KAT + property suite in three shapes —
  # native, wasm32-wasip1 (libtest under wasmtime), and the browser-shaped
  # wasm32-unknown-unknown (wasm-bindgen-test → Node) that exercises the
  # residual u64/BigInt and getrandom-`crypto.getRandomValues` boundary risks
  # (blueprint/core.md, blueprint/web-client.md) — plus the crates/wasm facade
  # boundary tests and the single ES-module artifact build.
  core-kats:
    name: Core KATs (native + WASM)
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-kats-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            core-kats-cargo-
            main-cargo-

      # wasm-bindgen-test-runner drives the wasm32-unknown-unknown legs in Node.
      - uses: ./.github/actions/wasm-bindgen-cli
        with:
          targets: wasm32-wasip1 wasm32-unknown-unknown

      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: KAT vectors fresh (committed generator is the only writer)
        run: |
          cargo run -p cipherbox-core --example kat_gen
          git diff --exit-code -- crates/core/kat
          test -z "$(git status --porcelain -- crates/core/kat)"

      - name: Core suite (native)
        run: cargo test -p cipherbox-core

      - name: Core suite (WASM, wasm32-wasip1 under wasmtime)
        run: cargo test -p cipherbox-core --target wasm32-wasip1

      # Browser-shaped leg: the KAT + property suite under Node via
      # wasm-bindgen-test. Count parity with the native run is the anti-vacuity
      # backstop (the test-file `#[test]` shadow routes both to this harness).
      - name: Core KAT + property suite (WASM, wasm32-unknown-unknown)
        run: cargo test -p cipherbox-core --target wasm32-unknown-unknown --test kat_manifest --test codec_props --test ipns_props --test seal_props

      # The crates/wasm facade boundary tests (u64/BigInt, getrandom wiring,
      # command/event shapes) run under the same Node harness.
      - name: WASM facade boundary tests (wasm32-unknown-unknown)
        run: cargo test -p cipherbox-wasm --target wasm32-unknown-unknown

      # getrandom tripwire: core is pure — entropy is injected, never
      # sourced in-tree (blueprint/core.md "Doctrine"). The global
      # getrandom_backend cfg in .cargo/config.toml defeats getrandom-0.3's
      # no-backend compile error, so a getrandom that sneaked into core's
      # production graph would silently link a live crypto.getRandomValues
      # backend. Fail closed: core's normal-edge wasm graph must pull no
      # getrandom (its dev-only proptest RNG is fine). Capture first so a
      # cargo-tree failure fails the step rather than skipping the check.
      - name: getrandom stays out of core's production graph (wasm)
        run: |
          graph=$(cargo tree -p cipherbox-core --target wasm32-unknown-unknown --edges normal)
          if echo "$graph" | grep -qi getrandom; then
            echo "::error::getrandom entered cipherbox-core's production graph — core must source no entropy (blueprint/core.md)."
            exit 1
          fi

      # The single wasm-bindgen ES module and its generated .d.ts contract must
      # build (blueprint/web-client.md) on any crate change, including one that
      # touches no TS; `Web Bundle` is what ships it.
      - name: Build the wasm-bindgen ES module and .d.ts
        run: |
          cargo build -p cipherbox-wasm --release --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir target/wasm-pkg --out-name cipherbox_wasm \
            target/wasm32-unknown-unknown/release/cipherbox_wasm.wasm
          test -f target/wasm-pkg/cipherbox_wasm.d.ts
          test -f target/wasm-pkg/cipherbox_wasm.js

  # The packages/client browser suite (blueprint/testing.md law 1, "Host
  # suites"): the engine's per-seam conformance kits run against the real
  # browser seam implementations — IndexedDB, OPFS, fetch — in a real browser
  # (worker realm) driven by Playwright. The conformance-featured WASM module
  # bridges the JS seams to the engine's Rust kits (crates/wasm/src/conformance.rs).
  # Depends on both the crates (WASM build) and packages, so it runs when either
  # changes. Merge-blocking.
  client-browser:
    name: Client Browser Suite
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.ts == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: client-browser-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            client-browser-cargo-
            main-cargo-

      # wasm-bindgen-cli drives the conformance module build.
      - uses: ./.github/actions/wasm-bindgen-cli

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @cipherbox/client exec playwright install --with-deps chromium

      # `test:browser` builds the conformance WASM, typechecks the harness
      # against the freshly generated wasm-bindgen glue, then runs Playwright.
      # The harness typecheck lives here rather than in the Typecheck job
      # because that glue only exists after the Rust build.
      - name: Typecheck harness + browser seam conformance suite
        run: pnpm --filter @cipherbox/client test:browser

  cargo-macos:
    name: Cargo Check & Test (macOS)
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      # The macOS host adapter links FUSE-T's libfuse ABI, so this leg is where
      # it compiles at all (blueprint/desktop.md "Backends").
      - uses: ./.github/actions/setup-fuse-t

      - name: Cargo check (workspace)
        run: cargo check --workspace --exclude cipherbox-desktop --exclude cipherbox-contract --exclude fuser --all-targets

      - name: Cargo test (workspace)
        run: cargo test --workspace --exclude cipherbox-desktop --exclude cipherbox-contract --exclude fuser

      - name: Real OS keyring credential seam
        run: cargo test -p cipherbox-desktop-seams --test conformance -- --ignored

  cargo-windows:
    name: Cargo Check & Test (Windows)
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Cargo check (workspace)
        run: cargo check --workspace --exclude cipherbox-desktop --exclude cipherbox-contract --exclude fuser --all-targets

      - name: Cargo test (workspace)
        run: cargo test --workspace --exclude cipherbox-desktop --exclude cipherbox-contract --exclude fuser

      - name: Real OS keyring credential seam
        run: cargo test -p cipherbox-desktop-seams --test conformance -- --ignored

  # The live contract suite (blueprint/testing.md "The contract suite"): the
  # sdk-e2e descendant and the sole contract enforcement. It stands up the CI
  # stack — Postgres, Kubo, the promoted mock-ipns-routing /routing/v1 store,
  # and the real NestJS API (a second instance in production mode to assert
  # test-login is hard-blocked) — then runs the engine's hand-written API
  # client against it. Contract drift fails a test run, not a grep. Runs
  # whenever Rust or TS changed (the client is Rust, the API is TS).
  contract-suite:
    name: Contract Suite
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.ts == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      ipfs:
        image: ipfs/kubo:v0.42.0
        ports:
          - 5001:5001
          - 8080:8080
        options: >-
          --health-cmd "ipfs id"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      NODE_ENV: test
      JWT_SECRET: contract-suite-jwt-secret
      # The hosted upload path pins to the CI Kubo service; a tiny per-account
      # quota lets a few-hundred-byte upload straddle the over-quota limit.
      KUBO_API_URL: http://localhost:5001
      QUOTA_DEFAULT_BYTES: '1024'
      # The client-presented secret must equal the API's TEST_LOGIN_SECRET.
      TEST_LOGIN_SECRET: contract-suite-secret
      # The whole suite logs in from one IP, so the per-IP auth bucket would
      # otherwise cap how many tests can exist. Only the test-mode
      # instance honors it; the production-mode one on 3100 refuses it, which
      # the suite asserts.
      THROTTLE_AUTH_LIMIT: '200'
      CONTRACT_API_URL: http://localhost:3000
      CONTRACT_API_PROD_URL: http://localhost:3100
      CONTRACT_TEST_LOGIN_SECRET: contract-suite-secret
      # The stack's gateway, so the suite can fetch back a block the ingress
      # pinned and prove it landed under the caller-computed address.
      CONTRACT_GATEWAY_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            linux-cargo-
            main-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The contract crate is excluded from the general cargo jobs, so lint it
      # here.
      - name: Cargo fmt and clippy (contract crate)
        run: |
          cargo fmt -p cipherbox-contract --check
          cargo clippy -p cipherbox-contract --all-targets -- -D warnings

      - uses: ./.github/actions/mock-ipns-routing

      - name: Apply migrations to a fresh database
        run: pnpm --filter @cipherbox/api migration:run

      - name: Build the API
        run: pnpm --filter @cipherbox/api build

      # A deployed profile fails closed on every credential it will later need, so
      # the production-mode instance gets a placeholder for each. None is ever
      # redeemed: it serves the test-login rejection assertion alone, and the
      # signing key is generated here so no key material is committed.
      - name: Boot the API in test and production modes
        run: |
          node apps/api/dist/main.js > /tmp/api-test.log 2>&1 &
          NODE_ENV=production PORT=3100 \
            IDENTITY_JWT_PRIVATE_KEY="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | base64 -w0)" \
            GOOGLE_CLIENT_ID=contract-suite-google-client-id \
            MAIL_PROVIDER=sendgrid \
            SENDGRID_API_KEY=contract-suite-sendgrid-key \
            MAIL_FROM_ADDRESS=no-reply@contract-suite.invalid \
            node apps/api/dist/main.js > /tmp/api-prod.log 2>&1 &
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 http://localhost:3000/health \
            || { echo '--- test-mode API log ---'; cat /tmp/api-test.log; exit 1; }
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 http://localhost:3100/health \
            || { echo '--- production-mode API log ---'; cat /tmp/api-prod.log; exit 1; }

      - name: Run the live contract suite
        run: cargo test -p cipherbox-contract

  # Single always-reporting gate for the contract suite, mirroring
  # desktop-build-result: branch protection requires this stable context so a
  # PR that touches neither Rust nor TS (the suite is skipped) is not blocked
  # forever, while a real contract-suite failure fails this gate.
  contract-suite-result:
    name: Contract Suite Result
    needs: contract-suite
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the contract suite to pass or be skipped
        env:
          CONTRACT_SUITE_RESULT: ${{ needs.contract-suite.result }}
        run: |
          echo "contract-suite result: ${CONTRACT_SUITE_RESULT}"
          if [ "${CONTRACT_SUITE_RESULT}" = 'failure' ] || [ "${CONTRACT_SUITE_RESULT}" = 'cancelled' ]; then
            echo "::error::contract-suite ${CONTRACT_SUITE_RESULT}"
            exit 1
          fi

  # Same fail-closed gating as web-bundle: a failed `wasm-engine` must surface
  # as a failed suite, not a skipped one.
  web-e2e:
    name: Web E2E Smoke
    needs: [changes, lint, wasm-engine]
    if: |
      !cancelled() && needs.lint.result == 'success' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.e2e == 'true')
    permissions:
      contents: read
    uses: ./.github/workflows/web-e2e.yml
    with:
      wasm-artifact: web-engine-wasm
      suite: smoke

  # Single always-reporting gate for the smoke slice, mirroring
  # contract-suite-result: branch protection requires this stable context, so a
  # PR that touches nothing the suite covers is not blocked forever while a real
  # smoke failure still fails this gate.
  web-e2e-result:
    name: Web E2E Smoke Result
    needs: web-e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the smoke slice to pass or be skipped
        env:
          WEB_E2E_RESULT: ${{ needs.web-e2e.result }}
        run: |
          echo "web-e2e result: ${WEB_E2E_RESULT}"
          if [ "${WEB_E2E_RESULT}" = 'failure' ] || [ "${WEB_E2E_RESULT}" = 'cancelled' ]; then
            echo "::error::web-e2e ${WEB_E2E_RESULT}"
            exit 1
          fi

  desktop-build:
    name: Desktop Build
    needs: [changes, lint]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            build-essential

      # The shell links the macOS host adapter, whose vendored `fuser` probes
      # `fuse-t.pc` at build time (blueprint/desktop.md "Backends").
      - uses: ./.github/actions/setup-fuse-t
        if: runner.os == 'macOS'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-desktop-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-desktop-cargo-

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cargo fmt (desktop shell)
        run: cargo fmt -p cipherbox-desktop --check

      - name: Cargo check (desktop shell)
        run: cargo check -p cipherbox-desktop --all-targets

      - name: Cargo clippy (desktop shell)
        run: cargo clippy -p cipherbox-desktop --all-targets -- -D warnings

      # The workspace-wide `cargo test` excludes this crate (webkit2gtk deps),
      # so the loopback OAuth callback's suite blocks a merge here or nowhere.
      - name: Cargo test (desktop shell)
        run: cargo test -p cipherbox-desktop

      # Builds the frontend too, through `beforeBuildCommand`.
      - name: Tauri build (unsigned, no bundle)
        run: pnpm --filter @cipherbox/desktop tauri build --no-bundle

  # Single always-reporting gate for the path-filtered desktop matrix. Branch
  # protection requires this stable context instead of the per-OS matrix legs:
  # the matrix legs are only reported when `desktop-build` actually runs (its
  # paths filter matched), so requiring them directly blocks every PR that does
  # not touch the desktop paths. This job runs on every PR and passes when the
  # matrix succeeded or was skipped, failing only on a real desktop-build break.
  desktop-build-result:
    name: Desktop Build Result
    needs: desktop-build
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require desktop build to pass or be skipped
        env:
          DESKTOP_BUILD_RESULT: ${{ needs.desktop-build.result }}
        run: |
          echo "desktop-build result: ${DESKTOP_BUILD_RESULT}"
          if [ "${DESKTOP_BUILD_RESULT}" = 'failure' ] || [ "${DESKTOP_BUILD_RESULT}" = 'cancelled' ]; then
            echo "::error::desktop-build ${DESKTOP_BUILD_RESULT}"
            exit 1
          fi
