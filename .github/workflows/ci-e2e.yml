# The main gate (blueprint/testing.md "CI gates"): a push to main runs the full
# web e2e suite, the desktop mounted matrix, and the cross-client leg. It bounds
# the blast radius of what the PR smoke slice missed; it is not the first line.
#
# A red run is a REVERT trigger, not a fix-forward one: revert the merge that
# turned it red, then land the fix through the PR gate.
#
# Job names are the contract (blueprint/deploy.md freeze step 4).
name: CI E2E Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  detect-changes:
    name: Detect Main Gate Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      web: ${{ steps.manual.outputs.web || steps.filter.outputs.web }}
      desktop: ${{ steps.manual.outputs.desktop || steps.filter.outputs.desktop }}
    steps:
      - name: Force all changes on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          echo "web=true" >> "$GITHUB_OUTPUT"
          echo "desktop=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          base: ${{ (github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD~1' }}
          # Each filter names everything its suite reads: both compile the
          # engine out of `crates/**` and boot the same API and record store,
          # and the cross-client leg also serves the web bundle.
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'tests/web-e2e/**'
              - 'tools/mock-ipns-routing/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - 'pnpm-lock.yaml'
              - '.github/actions/**'
              - '.github/workflows/web-e2e.yml'
              - '.github/workflows/ci-e2e.yml'
            desktop:
              - 'apps/desktop/**'
              - 'apps/web/**'
              - 'apps/api/**'
              - 'packages/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/config.toml'
              - 'tests/desktop-e2e/**'
              - 'tests/cross-client/**'
              - 'tools/mock-ipns-routing/**'
              - 'pnpm-lock.yaml'
              - '.github/actions/**'
              - '.github/workflows/desktop-e2e.yml'
              - '.github/workflows/ci-e2e.yml'

      - name: Summary
        env:
          WEB: ${{ steps.manual.outputs.web || steps.filter.outputs.web }}
          DESKTOP: ${{ steps.manual.outputs.desktop || steps.filter.outputs.desktop }}
        run: |
          echo "Web changes: ${WEB}"
          echo "Desktop changes: ${DESKTOP}"

  web-e2e:
    name: Web E2E
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/web-e2e.yml
    with:
      suite: full

  desktop-e2e:
    name: Desktop E2E
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-e2e.yml
