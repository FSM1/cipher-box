# Scheduled tier (blueprint/testing.md: Dispatch / scheduled). Long-horizon
# liveness soaks that must NOT block a PR: the republisher walk against a
# compressed-EOL profile. Two profiles run here — the in-process one drives
# months of virtual time through the walk, and the stack one runs the shipped
# API process against the CI stack (Postgres, Kubo, the /routing/v1 store) so
# lease renewal at seq+1 and the >24h-no-re-PUT alert are exercised on the real
# counters an operator pages on. Runs on a cron and on manual dispatch; the
# per-PR CI gate never runs these.
name: Scheduled Liveness

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  api-liveness:
    name: API Long-Horizon Liveness
    runs-on: ubuntu-latest
    # The horizons are compressed, so wall-clock stays short; cap it so a hung
    # run fails fast instead of drifting to GitHub's 6h default.
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The block store the registry's pin path talks to. The soak boots the
      # same stack shape as the merge gate, so the API under soak is the API
      # that ships rather than one missing a dependency.
      ipfs:
        image: ipfs/kubo:v0.42.0
        ports:
          - 5001:5001
          - 8080:8080
        options: >-
          --health-cmd "ipfs id"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      NODE_ENV: test
      JWT_SECRET: scheduled-liveness-jwt-secret
      TEST_LOGIN_SECRET: scheduled-liveness-login-secret
      KUBO_API_URL: http://localhost:5001
      ROUTING_V1_URL: http://localhost:3001
      # The compressed-EOL profile: the ~12h cadence and the >24h staleness
      # window collapse to seconds, so a starved name reaches its alert inside
      # the job's wall-clock budget. The suite reads these same vars to size its
      # waits, so the profile can never drift out of sync with the assertions.
      # The run bound stays below the cadence, as it is in production.
      REPUBLISHER_INTERVAL_MS: '3000'
      REPUBLISHER_STALE_ALERT_MS: '8000'
      REPUBLISHER_RUN_TIMEOUT_MS: '2500'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/mock-ipns-routing

      - name: Apply migrations to a fresh database
        run: pnpm --filter @cipherbox/api migration:run

      - name: Build and boot the API
        run: |
          pnpm --filter @cipherbox/api build
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 http://localhost:3000/health \
            || { echo '--- API log ---'; cat /tmp/api.log; exit 1; }

      - name: Run the compressed-EOL long-horizon suite
        run: pnpm --filter @cipherbox/api test:scheduled

      # The soak asserts on counters the API only logs a reason for; without the
      # log a failure says which metric stalled but never why.
      - name: Dump the API log on failure
        if: failure()
        run: cat /tmp/api.log
