# The desktop leg of the one product release train (blueprint/deploy.md,
# "Desktop release artifacts"): each v* tag carries one GitHub Release, and
# this attaches the three signed installer sets and latest.json to it.
name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  resolve-release:
    name: Resolve the release for the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      # tauri-action rewrites the name and body of a release it looks up by
      # tag, which drops the changelog release-please wrote. By release id it
      # only uploads, and a v* tag that carries no release fails closed.
      - name: Read the release id
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null); then
              echo "release_id=${id}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "no release for ${RELEASE_TAG} yet (attempt ${attempt}/6)"
            sleep 10
          done
          echo "::error::No GitHub Release for ${RELEASE_TAG}. release-please mints the tag through the release, so a tag without one was pushed by hand."
          exit 1

  build-desktop-macos:
    name: Build Desktop (macOS)
    needs: resolve-release
    runs-on: macos-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-fuse-t

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @cipherbox/crypto build
          pnpm --filter @cipherbox/core build
          pnpm --filter @cipherbox/api-client build
          pnpm --filter @cipherbox/sdk-core build
          pnpm --filter @cipherbox/sdk build

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_WEB3AUTH_CLIENT_ID: ${{ vars.VITE_WEB3AUTH_CLIENT_ID }}
          VITE_WEB3AUTH_VERIFIER: ${{ vars.VITE_WEB3AUTH_VERIFIER }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_ENVIRONMENT: staging
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_FARO_URL: ${{ vars.VITE_FARO_URL }}
          GRAFANA_FARO_API_KEY: ${{ secrets.GRAFANA_FARO_API_KEY }}
          GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          uploadUpdaterJson: true

  build-desktop-windows:
    name: Build Desktop (Windows)
    needs: resolve-release
    runs-on: windows-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-winfsp

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @cipherbox/crypto build
          pnpm --filter @cipherbox/core build
          pnpm --filter @cipherbox/api-client build
          pnpm --filter @cipherbox/sdk-core build
          pnpm --filter @cipherbox/sdk build

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_WEB3AUTH_CLIENT_ID: ${{ vars.VITE_WEB3AUTH_CLIENT_ID }}
          VITE_WEB3AUTH_VERIFIER: ${{ vars.VITE_WEB3AUTH_VERIFIER }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_ENVIRONMENT: staging
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_FARO_URL: ${{ vars.VITE_FARO_URL }}
          GRAFANA_FARO_API_KEY: ${{ secrets.GRAFANA_FARO_API_KEY }}
          GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          uploadUpdaterJson: true
          args: -- --no-default-features --features winfsp

  build-desktop-linux:
    name: Build Desktop (Linux)
    needs: resolve-release
    runs-on: ubuntu-22.04
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            libfuse3-dev \
            pkg-config \
            build-essential

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @cipherbox/crypto build
          pnpm --filter @cipherbox/core build
          pnpm --filter @cipherbox/api-client build
          pnpm --filter @cipherbox/sdk-core build
          pnpm --filter @cipherbox/sdk build

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_WEB3AUTH_CLIENT_ID: ${{ vars.VITE_WEB3AUTH_CLIENT_ID }}
          VITE_WEB3AUTH_VERIFIER: ${{ vars.VITE_WEB3AUTH_VERIFIER }}
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_ENVIRONMENT: staging
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_FARO_URL: ${{ vars.VITE_FARO_URL }}
          GRAFANA_FARO_API_KEY: ${{ secrets.GRAFANA_FARO_API_KEY }}
          GRAFANA_STACK_ID: ${{ vars.GRAFANA_STACK_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          uploadUpdaterJson: true
          args: -- --no-default-features --features fuse
