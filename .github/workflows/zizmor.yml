name: GitHub Actions Security Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: zizmor static audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install zizmor
        # Pin the scanner version so the supply-chain gate is itself reproducible
        # and not exposed to a malicious/broken upstream zizmor release.
        run: pip install zizmor==1.25.2

      # CLI plain mode via `pip install zizmor` — deliberately NOT the SARIF
      # GitHub Action wrapper, whose SARIF upload mode exits 0 on findings and is
      # useless as a hard gate. The plain CLI exits non-zero on any finding.
      # The audit scope is narrowed to unpinned-uses + excessive-permissions via
      # .github/zizmor.yml (the two Phase 53 supply-chain invariants); any future
      # un-pinned `uses:` ref or over-broad job token fails this gate.
      # --no-online-audits: the enforced invariants (unpinned-uses,
      # excessive-permissions) are offline audits; the online ones
      # (known-vulnerable-actions) depend on the GitHub advisories API and a
      # 503 there aborts the whole gate with "no audit was performed".
      # Dependabot covers action-version advisories separately.
      - name: Run zizmor
        run: zizmor --no-online-audits .github/workflows/
