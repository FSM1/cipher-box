# The scheduled tier (blueprint/deploy.md "Scheduled tier"): one cron surface
# owning every slot that runs off a schedule and never blocks a pull request —
# long-horizon liveness, full-matrix flake surveillance, the Cloudflare range
# watch, and the staging soak. A failure in any of them opens or updates one
# tracking issue, so a scheduled red is never a square nobody reads; the soak
# reports into its own issue.
#
# The liveness slot runs two profiles: the in-process one drives months of
# virtual time through the republisher walk, and the stack one runs the shipped
# API process against real Postgres and the real /routing/v1 store, so lease
# renewal at seq+1 and the >24h-no-re-PUT alert are exercised on the counters an
# operator pages on.
#
# GitHub reads `schedule` and `workflow_dispatch` from the default branch alone,
# so this file is inert until it lands on main.
name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  api-liveness:
    name: API Long-Horizon Liveness
    runs-on: ubuntu-latest
    # The horizons are compressed, so wall-clock stays short; cap it so a hung
    # run fails fast instead of drifting to GitHub's 6h default.
    timeout-minutes: 20
    permissions:
      contents: read

    # No block store: the walk moves records over /routing/v1 only, and the soak
    # registers names carrying no content.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      NODE_ENV: test
      JWT_SECRET: nightly-liveness-jwt-secret
      TEST_LOGIN_SECRET: nightly-liveness-login-secret
      ROUTING_V1_URL: http://localhost:3001
      # The compressed-EOL profile: the ~12h cadence and the >24h staleness
      # window collapse to seconds, so a starved name reaches its alert inside
      # the job's wall-clock budget. The suite reads these same vars to size its
      # waits and refuses to run without them.
      REPUBLISHER_INTERVAL_MS: '3000'
      REPUBLISHER_STALE_ALERT_MS: '8000'
      REPUBLISHER_RUN_TIMEOUT_MS: '2500'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/mock-ipns-routing

      - name: Apply migrations to a fresh database
        run: pnpm --filter @cipherbox/api migration:run

      - name: Build and boot the API
        run: |
          pnpm --filter @cipherbox/api build
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 http://localhost:3000/health

      - name: Run the compressed-EOL long-horizon suite
        run: pnpm --filter @cipherbox/api test:scheduled

      - name: Dump the API log on failure
        if: failure()
        run: cat /tmp/api.log

  flake-surveillance:
    name: Full-Matrix Flake Surveillance
    permissions:
      contents: read
    # The main gate itself, not a copy of it. `force-all` stands in for the push
    # change filter, which has no base commit on a night with no push.
    uses: ./.github/workflows/ci-e2e.yml
    with:
      force-all: true

  cloudflare-ranges:
    name: Cloudflare Range Watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      # Node builtins and the committed snapshot only, so an upstream range
      # change is never reported as a dependency failure.
      - name: Diff the trusted ranges against Cloudflare
        run: node scripts/check-cloudflare-ranges.mjs

  # The soak suite comes from the tag that staging runs, so the tests and the
  # deploy are one revision.
  staging-soak-tag:
    name: Resolve The Staging Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the `staging-<date>-release-<n>` shape that `tag-staging.yml`
      # mints: the v1 tags sort above it by name.
      - name: Pick the newest staging tag
        id: tag
        run: |
          set -euo pipefail
          git tag -l 'staging-*' > "${RUNNER_TEMP}/staging-tags.txt"
          pnpm --filter @cipherbox/web-e2e exec tsx staging/soak/checkInputs.ts \
            newest-tag "${RUNNER_TEMP}/staging-tags.txt"

  # A failed night goes to the soak's own issue. The report below takes only a
  # soak run whose report job did not finish.
  staging-soak:
    name: Staging Soak
    needs: staging-soak-tag
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/staging-soak.yml
    secrets: inherit
    with:
      ref: ${{ needs.staging-soak-tag.outputs.tag }}

  report:
    name: Report A Nightly Failure
    needs: [api-liveness, flake-surveillance, cloudflare-ranges, staging-soak-tag, staging-soak]
    # Not `failure()`: a failed soak leg fails the soak call, and that night is
    # already in the soak issue.
    if: >-
      ${{ !cancelled() && (
        needs.api-liveness.result == 'failure' ||
        needs.flake-surveillance.result == 'failure' ||
        needs.cloudflare-ranges.result == 'failure' ||
        needs.staging-soak-tag.result == 'failure' ||
        (needs.staging-soak.result != 'skipped' && needs.staging-soak.result != 'cancelled' &&
          needs.staging-soak.outputs.reported != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # One tracking issue, reused: a nightly that stays red for a week must not
      # file seven issues. The body names the slot, so one issue still routes.
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIVENESS: ${{ needs.api-liveness.result }}
          SURVEILLANCE: ${{ needs.flake-surveillance.result }}
          RANGES: ${{ needs.cloudflare-ranges.result }}
          SOAK_TAG: ${{ needs.staging-soak-tag.result }}
          SOAK_REPORTED: ${{ needs.staging-soak.outputs.reported || 'false' }}
          TITLE: 'ci: a nightly run failed'
        run: |
          set -euo pipefail
          {
            echo "Run: ${RUN_URL}"
            echo
            echo "| slot | result |"
            echo "| --- | --- |"
            echo "| API Long-Horizon Liveness | ${LIVENESS} |"
            echo "| Full-Matrix Flake Surveillance | ${SURVEILLANCE} |"
            echo "| Cloudflare Range Watch | ${RANGES} |"
            echo "| Staging Soak tag | ${SOAK_TAG} |"
            echo "| Staging Soak report finished | ${SOAK_REPORTED} |"
          } > "${RUNNER_TEMP}/nightly-report.md"
          number=$(gh issue list --state open --label comp:ci --limit 500 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body-file "${RUNNER_TEMP}/nightly-report.md"
          else
            gh issue create --title "${TITLE}" --label comp:ci \
              --body-file "${RUNNER_TEMP}/nightly-report.md"
          fi
