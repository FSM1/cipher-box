name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions: {}

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title follows Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Conventional Commits pattern: type(optional-scope)(optional-!) : description
          # Types must match commitlint config used by husky
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+'

          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title does not follow Conventional Commits format."
            echo ""
            echo "Expected: <type>(<optional scope>): <description>"
            echo "Got:      $PR_TITLE"
            echo ""
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Examples:"
            echo "  feat: add file sharing"
            echo "  fix(api): handle null vault ID"
            echo "  chore: update dependencies"
            exit 1
          fi

          # Check for parenthesized text in the description (after "type(scope): ")
          # This breaks Release Please's conventional commit parser which
          # misinterprets parens as a malformed scope.
          description="${PR_TITLE#*: }"
          if [[ "$description" =~ \(.+\) ]]; then
            echo "::error::PR title description must not contain parenthesized text (e.g., \"(some words)\")."
            echo ""
            echo "Release Please's commit parser misinterprets parentheses in the"
            echo "description as a malformed scope, causing silent release failures."
            echo ""
            echo "Got: $PR_TITLE"
            echo ""
            echo "Instead, use dashes, brackets, or remove the parens:"
            echo "  feat: Phase 11 — Windows Desktop - WinFsp virtual filesystem"
            echo "  feat: Phase 11 — Windows Desktop [WinFsp virtual filesystem]"
            exit 1
          fi

          echo "PR title is valid: $PR_TITLE"
