# The web e2e suite (blueprint/testing.md), in two slices: `smoke` is the PR
# gate's bounded-minutes budget, `full` is the main gate's whole suite. The
# suite runs against the production static build, so it needs the engine WASM: a
# caller passes `wasm-artifact` to hand over the module its run already built,
# and a caller that does not gets the module built here. It builds the bundle
# twice: once as it ships, once with `VITE_E2E_HOOK` for the introspection seam.
# The suite asserts the shipping one carries no hook.
name: Web E2E Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which slice to run
        required: false
        default: smoke
        type: choice
        options: [smoke, full]
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string
      wasm-artifact:
        description: >-
          Name of a run artifact holding a prebuilt engine WASM module. Set it
          and the suite tests exactly those bytes; leave it empty and this job
          builds the module itself, which is what a standalone dispatch needs.
        required: false
        default: ''
        type: string
      suite:
        description: >-
          Which slice to run: `smoke` drops every `@full`-tagged spec and holds
          the PR gate's minutes budget; `full` runs the whole suite.
        required: false
        default: smoke
        type: string

permissions: {}

jobs:
  web-e2e:
    # Both callers get the name their slice earns, and `smoke` renders exactly
    # the name branch protection already knows.
    name: Web E2E ${{ inputs.suite == 'full' && 'Full' || 'Smoke' }}
    runs-on: ubuntu-latest
    # The suite itself runs in seconds; the budget covers a standalone
    # dispatch, where a cold-cache wasm build runs ahead of it.
    timeout-minutes: 45
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The write path's block store. Without it `KuboPinStore` refuses every
      # hosted upload with a 503, which the drain charges as a spent attempt —
      # so a write spec dead-letters rather than merely failing to publish.
      ipfs:
        image: ipfs/kubo:v0.42.0
        ports:
          - 5001:5001
          - 8080:8080
        options: >-
          --health-cmd "ipfs id"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      JWT_SECRET: web-e2e-jwt-secret
      KUBO_API_URL: http://localhost:5001
      # Every test cold-starts its own account from one runner IP, so the
      # per-IP auth bucket would otherwise cap how many specs can exist.
      THROTTLE_AUTH_LIMIT: '200'
      CORS_ALLOWED_ORIGINS: http://localhost:4173,http://localhost:4174
      # `ci` names no deployment, so the bundle needs no Web3Auth identifiers:
      # the suite hands the engine a login secret through the introspection seam
      # rather than through an interactive Core Kit session.
      VITE_ENVIRONMENT: ci
      VITE_API_URL: http://localhost:3000
      # Present but not real: the front-door spec asserts every built method is
      # offered, and a build without this one offers Google as unavailable. No
      # test signs in through Google, so the value is never redeemed.
      VITE_GOOGLE_CLIENT_ID: web-e2e-google-client-id
      # The hermetic record store, in place of the public default — a merge gate
      # must not resolve vault pointers over the internet.
      VITE_ROUTING_ENDPOINTS: http://localhost:3001
      # The same stack's gateway, so a read pulls its blocks back from where the
      # upload pinned them rather than from the tab that wrote them. By address,
      # not by name: Kubo serves `localhost` as a *subdomain* gateway and 301s
      # every path request to `<cid>.ipfs.localhost`, which resolves nowhere.
      VITE_READ_ACCELERATOR_URL: http://127.0.0.1:8080

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Fail fast on a missing or malformed handover, before the stack boots.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.wasm-artifact != ''
        with:
          name: ${{ inputs.wasm-artifact }}
          path: apps/web/src/wasm

      # Same path set as `ci.yml`'s `Web Engine WASM` cache, for the same reason.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.wasm-artifact == ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/wasm32-unknown-unknown
          key: web-e2e-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            web-e2e-cargo-
            main-wasm-cargo-

      - uses: ./.github/actions/wasm-bindgen-cli
        if: inputs.wasm-artifact == ''

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/mock-ipns-routing

      # `NODE_ENV` stays on the API's own steps. Vite reads it to decide whether a
      # build is a production one, so job-wide it would hand the suite a
      # development bundle of the app it is meant to test as it ships.
      - name: Apply migrations to a fresh database
        run: pnpm --filter @cipherbox/api migration:run
        env:
          NODE_ENV: test

      - name: Build and boot the API
        run: |
          pnpm --filter @cipherbox/api build
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 http://localhost:3000/health \
            || { echo '--- API log ---'; cat /tmp/api.log; exit 1; }
        env:
          NODE_ENV: test

      # One engine module feeds both bundles below; only the hook flag differs
      # between them.
      - name: Build the engine WASM
        if: inputs.wasm-artifact == ''
        run: pnpm --filter @cipherbox/web run build:wasm

      - name: Build the shipping bundle
        run: |
          pnpm --filter @cipherbox/web run build:bundle
          mv apps/web/dist apps/web/dist-release

      - name: Build the e2e bundle
        run: pnpm --filter @cipherbox/web run build:bundle
        env:
          VITE_E2E_HOOK: 'true'

      - uses: ./.github/actions/playwright-chromium
        with:
          package: '@cipherbox/web-e2e'
          working-directory: tests/web-e2e

      # Named `test:e2e`, not `test`: the area unit-test gates run no
      # suite that needs a live stack. The step timeout is the slice's test-time
      # budget, so a smoke slice that outgrows the PR gate trips here.
      - name: Run the web e2e suite
        timeout-minutes: ${{ inputs.suite == 'full' && 30 || 12 }}
        run: pnpm --filter @cipherbox/web-e2e test:e2e
        env:
          E2E_SUITE: ${{ inputs.suite }}

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-report
          path: |
            tests/web-e2e/playwright-report/
            tests/web-e2e/test-results/
          retention-days: 7
