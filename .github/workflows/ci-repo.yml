# The Repo area of the PR gate (blueprint/testing.md): the checks that read the
# whole repository and answer to no path filter. Called by ci.yml.
name: CI Repo

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      # The Caddyfile is shipped to the VPS by scp and never compiled in CI, so
      # a config that no longer parses — or one that quietly stops enforcing the
      # accelerator front's egress obligations — reaches staging unnoticed.
      # Built once with a layer cache and handed to the checker: an unchanged
      # Dockerfile restores in seconds instead of compiling Caddy on every PR.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/caddy
          load: true
          tags: cipherbox-caddy:lint
          cache-from: type=gha,scope=caddy-front
          cache-to: type=gha,scope=caddy-front,mode=max

      - name: Check the accelerator front's egress obligations
        env:
          CADDY_IMAGE: cipherbox-caddy:lint
        run: pnpm lint:accelerator-front

  # The ops tooling behind `tools/perf/RESULTS.md`. It answers to no path
  # filter for the same reason the Repo area exists: the runner reads the load
  # harness's report shape and the cross-client harness's wait samples, and a
  # change to either lands outside `tools/`.
  perf-tooling:
    name: Perf Tooling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the baseline runner
        run: pnpm --filter @cipherbox/perf run typecheck

      - name: Run the baseline runner unit suite
        run: pnpm --filter @cipherbox/perf run test

  tracker-refs:
    name: Tracker Refs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: No source comment names a tracking issue
        run: node scripts/check-tracker-refs.mjs

  # The mock /routing/v1 record store holds the monotonic-sequence rule that a
  # real routing endpoint holds, so a rollback cannot reach a client. The suite
  # runs here, under no path filter, because the Repo area is the only gate that
  # blocks every merge. The tool is not a pnpm workspace member: it installs,
  # builds and tests with its own npm, sharing the cache key the composite
  # action at .github/actions/mock-ipns-routing uses.
  mock-routing-store:
    name: Mock Routing Store
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No git operation follows the checkout, and the steps below run npm and
      # vitest over third-party code, so the job token stays out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: mock-ipns-routing-npm-${{ runner.os }}-${{ hashFiles('tools/mock-ipns-routing/package-lock.json') }}

      - name: Install, typecheck, build and test the record store
        working-directory: tools/mock-ipns-routing
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
