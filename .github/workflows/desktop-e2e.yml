# The desktop mounted e2e suite and the cross-client suite
# (blueprint/testing.md): the real Tauri binary on a real mount, driven through
# the filesystem and the vault it projects, and — for cross-client — the built
# web artifact headless beside that mount against one stack.
#
# Two suites, one runner class (blueprint/deploy.md "Runners"): cross-client
# rides the mounted matrix rather than provisioning a fourth. Each suite is its
# own leg of the matrix, so each reports its own gate.
#
# The binary is built with the `e2e-hook` feature, which adds the dev-key
# headless entry and a loopback control endpoint. A shipping build compiles
# neither, and the default-feature cargo job asserts that.
#
# The suite needs no test credential: a dev key is a fresh 32-byte scalar, and
# challenge-signature login mints the account on first contact. So this
# workflow reads no secret, and `secrets: inherit` from a caller buys nothing.
#
# Job names are the contract (blueprint/deploy.md freeze step 4). `ci-e2e.yml`
# and `tag-staging.yml` call this workflow and read the `ref` input.
#
# The Windows shell links the WinFsp adapter and its mount does not land, so its
# projection never leaves `opening`; it joins this matrix when it does. Every
# step that leg needs is here already.
#
# The cross-client suite runs one leg, macOS. The Playwright cache step below
# names the condition a second cross-client host has to clear.
name: Desktop E2E Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string

permissions: {}

jobs:
  desktop-e2e:
    name: ${{ matrix.label }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            suite: mounted
            label: Desktop E2E
            timeoutMinutes: 45
          - platform: linux
            os: ubuntu-latest
            suite: mounted
            label: Desktop E2E
            timeoutMinutes: 45
          # The cross-client leg builds the wasm engine and the web bundle on
          # top of everything the mounted leg does, so it takes the longer cap.
          - platform: macos
            os: macos-latest
            suite: cross-client
            label: Cross-Client E2E
            timeoutMinutes: 60

    env:
      # The desktop binary reads these at compile time (`option_env!` in
      # `apps/desktop/src-tauri/src/engine/config.rs`), so they must be set for
      # the cargo build rather than for the run.
      VITE_API_URL: http://localhost:3000
      VITE_ROUTING_ENDPOINTS: http://localhost:3001
      # Kubo's gateway by address: it serves `localhost` as a subdomain gateway
      # and redirects every path request to a name that resolves nowhere.
      VITE_READ_ACCELERATOR_URL: http://127.0.0.1:8080
      # The only value that selects the compressed CI sync timing profile and
      # the small CI storage budget.
      VITE_ENVIRONMENT: ci
      # The API under test.
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      JWT_SECRET: desktop-e2e-jwt-secret
      KUBO_API_URL: http://localhost:5001
      # Two instances cold-start the same account from one runner address, and
      # the per-address auth bucket would otherwise cap the scenarios.
      THROTTLE_AUTH_LIMIT: '200'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-fuse-t
        if: runner.os == 'macOS'

      # WinFsp before cargo: `winfsp-sys` reads the headers and the import
      # library out of the installation, and `winfsp_init` loads its DLL from
      # the same registry key at mount time.
      - uses: ./.github/actions/setup-winfsp
        if: runner.os == 'Windows'

      # `fuse3` supplies the `fusermount3` binary the vendored fuser mounts
      # through. The webkit and appindicator packages are the Tauri shell's own
      # link dependencies.
      - name: Provision the Linux mount and shell dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            fuse3 \
            pkg-config \
            build-essential \
            xvfb \
            x11-utils
          sudo modprobe fuse

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-e2e-${{ matrix.platform }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: desktop-e2e-${{ matrix.platform }}-cargo-

      # The wasm target rides its own key. Both macOS legs share the key above,
      # and on a hit neither leg saves, so a tree only the cross-client leg
      # builds would never reach that cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.suite == 'cross-client'
        with:
          path: target/wasm32-unknown-unknown
          key: cross-client-e2e-${{ matrix.platform }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: cross-client-e2e-${{ matrix.platform }}-wasm-

      # `tauri-build` embeds the frontend, so the bundle must exist before cargo
      # runs. The headless entry never loads it, but the build still reads it.
      - name: Build the desktop frontend
        run: pnpm --filter "@cipherbox/desktop..." run build

      - name: Build the desktop binary with the e2e hook
        run: cargo build -p cipherbox-desktop --features e2e-hook

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: postgres
          password: postgres
          database: cipherbox_test
          postgres-version: '16'

      - name: Start Kubo
        shell: bash
        run: |
          set -euo pipefail
          # One pinned release on every leg, the version every sibling
          # workflow runs. Homebrew pins nothing.
          KUBO_VERSION=v0.42.0
          # The archive runs as a daemon on the runner, so the digest is pinned
          # here rather than taken from the same host that serves the archive.
          KUBO_FORMAT=tar.gz
          case "$RUNNER_OS" in
            macOS)
              KUBO_PLATFORM=darwin-arm64
              KUBO_SHA512=5f863972f7edee0ac3f003d8b097366927e8d9f651fd5c74e1fda980f766dbf7af4b8a813b13400eb2bcf3a871a494a139c85f022e239b237581ad152259cd22
              ;;
            Windows)
              KUBO_PLATFORM=windows-amd64
              KUBO_FORMAT=zip
              KUBO_SHA512=5501a7745898e71326e1b85d8d231d79a3409147484ce2ca28da94c9272319e6c691e19a1ed74c0f0a7beb601fb203e10a6c242aaab1a5961c260b1b0d14c452
              ;;
            *)
              KUBO_PLATFORM=linux-amd64
              KUBO_SHA512=054c38a0cf66f7d738e25085ad62cb3a42d03d4bac329b7dd25c1d71cf18e1ce87d55b1d1b705b04c65210dca9109973579e0eb1cd72f6341ecb3311d840d156
              ;;
          esac
          KUBO_ARCHIVE="$RUNNER_TEMP/kubo_${KUBO_VERSION}_${KUBO_PLATFORM}.${KUBO_FORMAT}"
          curl -fsSL --retry 3 -o "$KUBO_ARCHIVE" \
            "https://dist.ipfs.tech/kubo/${KUBO_VERSION}/kubo_${KUBO_VERSION}_${KUBO_PLATFORM}.${KUBO_FORMAT}"
          echo "${KUBO_SHA512}  ${KUBO_ARCHIVE}" | shasum -a 512 -c -
          if [ "$KUBO_FORMAT" = zip ]; then
            # Git bash ships GNU tar, which reads no zip. Windows ships bsdtar.
            "$(cygpath "$SYSTEMROOT")/System32/tar.exe" -xf "$KUBO_ARCHIVE"
          else
            tar -xzf "$KUBO_ARCHIVE"
          fi
          # On PATH rather than installed: the release ships no installer for
          # every platform, and this job needs no system-wide binary.
          echo "$PWD/kubo" >> "$GITHUB_PATH"
          export PATH="$PWD/kubo:$PATH"
          ipfs init --profile server
          ipfs daemon > "$RUNNER_TEMP/kubo.log" 2>&1 &
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 \
            -X POST http://localhost:5001/api/v0/id > /dev/null \
            || { echo '--- kubo log ---'; cat "$RUNNER_TEMP/kubo.log"; exit 1; }

      - uses: ./.github/actions/mock-ipns-routing

      # `NODE_ENV` stays on the steps that need it. Job-wide, Vite reads it and
      # hands the suite a development bundle of the app under test.
      - name: Apply migrations to a fresh database
        run: pnpm --filter @cipherbox/api migration:run
        env:
          NODE_ENV: test

      - name: Build the API
        run: pnpm --filter @cipherbox/api build

      - uses: ./.github/actions/wasm-bindgen-cli
        if: matrix.suite == 'cross-client'

      # The web host under test is the shipping bundle plus the introspection
      # hook, served from a built directory — the artifact that ships is the
      # artifact tested (blueprint/testing.md "E2E").
      - name: Build the web bundle the cross-client suite serves
        if: matrix.suite == 'cross-client'
        run: |
          pnpm --filter @cipherbox/web run build:wasm
          pnpm --filter @cipherbox/web run build:bundle
        env:
          VITE_E2E_HOOK: 'true'
          # The front door needs it to build. It stays off the job-wide block:
          # a `VITE_` value there is a compile-time input to the desktop binary.
          VITE_GOOGLE_CLIENT_ID: cross-client-google-client-id

      - name: Resolve the Playwright version
        if: matrix.suite == 'cross-client'
        id: playwright
        working-directory: tests/cross-client
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The path is the macOS browser cache, which is what holds this suite to
      # one leg: a second cross-client host needs the path chosen by runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.suite == 'cross-client'
        id: playwright-cache
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The real Chrome headless, not `chrome-headless-shell`: the shell
      # segfaults on a page that registers a Service Worker, and the bundle
      # registers one.
      - name: Install Playwright Chromium
        if: matrix.suite == 'cross-client' && steps.playwright-cache.outputs.cache-hit != 'true'
        # A stalled browser download otherwise runs to the job cap, and reports
        # as a suite failure rather than as the install failure it is.
        timeout-minutes: 10
        run: pnpm --filter @cipherbox/cross-client-e2e exec playwright install chromium

      # The orchestrator owns the API process, because a scenario needs a real
      # outage.
      - name: Run the mounted suite
        if: matrix.suite == 'mounted'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            Xvfb :99 -screen 0 1024x768x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
            export DISPLAY=:99
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            # The shell is a webview app. It blocks on a display that does not
            # answer yet, and then writes no control file at all.
            for _ in $(seq 1 30); do
              xdpyinfo -display :99 > /dev/null 2>&1 && break
              sleep 1
            done
            xdpyinfo -display :99 > /dev/null \
              || { echo '--- Xvfb log ---'; cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          fi
          pnpm --filter @cipherbox/desktop-e2e run test:e2e
        env:
          CIPHERBOX_DESKTOP_BINARY: ${{ github.workspace }}/target/debug/cipherbox-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
          CIPHERBOX_API_ENTRY: ${{ github.workspace }}/apps/api/dist/main.js
          CIPHERBOX_E2E_WORKDIR: ${{ runner.temp }}/desktop-e2e
          CIPHERBOX_API_URL: http://localhost:3000
          NODE_ENV: test

      # One stack serves both hosts, so the suite starts nothing of the API's or
      # the record store's; it owns only the API process and the preview server.
      - name: Run the cross-client suite
        if: matrix.suite == 'cross-client'
        run: pnpm --filter @cipherbox/cross-client-e2e run test:e2e
        env:
          CIPHERBOX_DESKTOP_BINARY: ${{ github.workspace }}/target/debug/cipherbox-desktop
          CIPHERBOX_API_ENTRY: ${{ github.workspace }}/apps/api/dist/main.js
          CIPHERBOX_E2E_WORKDIR: ${{ runner.temp }}/cross-client-e2e
          CIPHERBOX_API_URL: http://localhost:3000
          # The suite owns the API child, which inherits this: the bundle is
          # served on the port `CIPHERBOX_WEB_PORT` defaults to.
          CORS_ALLOWED_ORIGINS: http://localhost:4175
          NODE_ENV: test

      - name: Collect the logs a failure leaves
        if: failure()
        shell: bash
        run: |
          mkdir -p failure-logs
          # Only the log files: the home roots hold the account directory and
          # the control token, and neither may reach an artifact.
          # -xdev: a scenario that failed can leave a mount under the workdir,
          # and descending into one hangs the collection rather than reading it.
          find "${RUNNER_TEMP}/desktop-e2e" -xdev -name '*.log' -exec cp {} failure-logs/ \; 2>/dev/null || true
          find "${RUNNER_TEMP}/cross-client-e2e" -xdev -name '*.log' -exec cp {} failure-logs/ \; 2>/dev/null || true
          cp "${RUNNER_TEMP}/kubo.log" failure-logs/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/xvfb.log" failure-logs/ 2>/dev/null || true
          cp /tmp/mock-ipns-routing.log failure-logs/ 2>/dev/null || true
          cp ~/Library/Logs/fuse-t/fuse-t.log failure-logs/ 2>/dev/null || true

      - name: Upload the logs a failure leaves
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-logs-${{ matrix.suite }}-${{ matrix.platform }}
          path: failure-logs/
          retention-days: 7
