# The desktop mounted e2e suite (blueprint/testing.md): the real Tauri binary
# on a real mount, driven through the filesystem and the vault it projects.
#
# The binary is built with the `e2e-hook` feature, which adds the dev-key
# headless entry and a loopback control endpoint. A shipping build compiles
# neither, and the default-feature cargo job asserts that.
#
# The suite needs no test credential: a dev key is a fresh 32-byte scalar, and
# challenge-signature login mints the account on first contact. So this
# workflow reads no secret, and `secrets: inherit` from a caller buys nothing.
#
# Job names are the contract (blueprint/deploy.md freeze step 4). `ci-e2e.yml`
# and `tag-staging.yml` call this workflow and read the `ref` input.
#
# Two legs today. The Windows shell links the WinFsp adapter and its mount does
# not land, so its projection never leaves `opening`; it joins this matrix when
# it does. Every step that leg needs is here already.
name: Desktop E2E Tests

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout (tag, branch, or SHA)'
        required: false
        type: string

permissions: {}

jobs:
  desktop-e2e:
    name: Desktop E2E (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest

    env:
      # The desktop binary reads these at compile time (`option_env!` in
      # `apps/desktop/src-tauri/src/engine/config.rs`), so they must be set for
      # the cargo build rather than for the run.
      VITE_API_URL: http://localhost:3000
      VITE_ROUTING_ENDPOINTS: http://localhost:3001
      # Kubo's gateway by address: it serves `localhost` as a subdomain gateway
      # and redirects every path request to a name that resolves nowhere.
      VITE_READ_ACCELERATOR_URL: http://127.0.0.1:8080
      # The only value that selects the compressed CI sync timing profile and
      # the small CI storage budget.
      VITE_ENVIRONMENT: ci
      # The API under test.
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: cipherbox_test
      JWT_SECRET: desktop-e2e-jwt-secret
      KUBO_API_URL: http://localhost:5001
      # Two instances cold-start the same account from one runner address, and
      # the per-address auth bucket would otherwise cap the scenarios.
      THROTTLE_AUTH_LIMIT: '200'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-fuse-t
        if: runner.os == 'macOS'

      # WinFsp before cargo: `winfsp-sys` reads the headers and the import
      # library out of the installation, and `winfsp_init` loads its DLL from
      # the same registry key at mount time.
      - uses: ./.github/actions/setup-winfsp
        if: runner.os == 'Windows'

      # `fuse3` supplies the `fusermount3` binary the vendored fuser mounts
      # through. The webkit and appindicator packages are the Tauri shell's own
      # link dependencies.
      - name: Provision the Linux mount and shell dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            fuse3 \
            pkg-config \
            build-essential \
            xvfb \
            x11-utils
          sudo modprobe fuse

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-e2e-${{ matrix.platform }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: desktop-e2e-${{ matrix.platform }}-cargo-

      # `tauri-build` embeds the frontend, so the bundle must exist before cargo
      # runs. The headless entry never loads it, but the build still reads it.
      - name: Build the desktop frontend
        run: pnpm --filter "@cipherbox/desktop..." run build

      - name: Build the desktop binary with the e2e hook
        run: cargo build -p cipherbox-desktop --features e2e-hook

      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        with:
          username: postgres
          password: postgres
          database: cipherbox_test
          postgres-version: '16'

      - name: Start Kubo
        shell: bash
        run: |
          set -euo pipefail
          # One pinned release on both legs, the version every sibling
          # workflow runs. Homebrew pins nothing.
          KUBO_VERSION=v0.42.0
          # The archive runs as a daemon on the runner, so the digest is pinned
          # here rather than taken from the same host that serves the archive.
          if [ "$RUNNER_OS" = "macOS" ]; then
            KUBO_PLATFORM=darwin-arm64
            KUBO_SHA512=5f863972f7edee0ac3f003d8b097366927e8d9f651fd5c74e1fda980f766dbf7af4b8a813b13400eb2bcf3a871a494a139c85f022e239b237581ad152259cd22
          else
            KUBO_PLATFORM=linux-amd64
            KUBO_SHA512=054c38a0cf66f7d738e25085ad62cb3a42d03d4bac329b7dd25c1d71cf18e1ce87d55b1d1b705b04c65210dca9109973579e0eb1cd72f6341ecb3311d840d156
          fi
          KUBO_ARCHIVE="$RUNNER_TEMP/kubo_${KUBO_VERSION}_${KUBO_PLATFORM}.tar.gz"
          curl -fsSL --retry 3 -o "$KUBO_ARCHIVE" \
            "https://dist.ipfs.tech/kubo/${KUBO_VERSION}/kubo_${KUBO_VERSION}_${KUBO_PLATFORM}.tar.gz"
          echo "${KUBO_SHA512}  ${KUBO_ARCHIVE}" | shasum -a 512 -c -
          tar -xzf "$KUBO_ARCHIVE"
          # On PATH rather than installed: the release ships no installer for
          # every platform, and this job needs no system-wide binary.
          echo "$PWD/kubo" >> "$GITHUB_PATH"
          export PATH="$PWD/kubo:$PATH"
          ipfs init --profile server
          ipfs daemon > "$RUNNER_TEMP/kubo.log" 2>&1 &
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 \
            -X POST http://localhost:5001/api/v0/id > /dev/null \
            || { echo '--- kubo log ---'; cat "$RUNNER_TEMP/kubo.log"; exit 1; }

      - uses: ./.github/actions/mock-ipns-routing

      # `NODE_ENV` stays on the steps that need it. Job-wide, Vite reads it and
      # hands the suite a development bundle of the app under test.
      - name: Apply migrations to a fresh database
        run: pnpm --filter @cipherbox/api migration:run
        env:
          NODE_ENV: test

      - name: Build the API
        run: pnpm --filter @cipherbox/api build

      # The orchestrator owns the API process, so the offline-replay scenario
      # can take the API away and give it back.
      - name: Run the mounted suite
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            Xvfb :99 -screen 0 1024x768x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
            export DISPLAY=:99
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            # The shell is a webview app. It blocks on a display that does not
            # answer yet, and then writes no control file at all.
            for _ in $(seq 1 30); do
              xdpyinfo -display :99 > /dev/null 2>&1 && break
              sleep 1
            done
            xdpyinfo -display :99 > /dev/null \
              || { echo '--- Xvfb log ---'; cat "$RUNNER_TEMP/xvfb.log"; exit 1; }
          fi
          pnpm --filter @cipherbox/desktop-e2e run test:e2e
        env:
          CIPHERBOX_DESKTOP_BINARY: ${{ github.workspace }}/target/debug/cipherbox-desktop${{ runner.os == 'Windows' && '.exe' || '' }}
          CIPHERBOX_API_ENTRY: ${{ github.workspace }}/apps/api/dist/main.js
          CIPHERBOX_E2E_WORKDIR: ${{ runner.temp }}/desktop-e2e
          CIPHERBOX_API_URL: http://localhost:3000
          NODE_ENV: test

      - name: Collect the logs a failure leaves
        if: failure()
        shell: bash
        run: |
          mkdir -p failure-logs
          # Only the log files: the home roots hold the account directory and
          # the control token, and neither may reach an artifact.
          # -xdev: a scenario that failed can leave a mount under the workdir,
          # and descending into one hangs the collection rather than reading it.
          find "${RUNNER_TEMP}/desktop-e2e" -xdev -name '*.log' -exec cp {} failure-logs/ \; 2>/dev/null || true
          cp "${RUNNER_TEMP}/kubo.log" failure-logs/ 2>/dev/null || true
          cp "${RUNNER_TEMP}/xvfb.log" failure-logs/ 2>/dev/null || true
          cp /tmp/mock-ipns-routing.log failure-logs/ 2>/dev/null || true
          cp ~/Library/Logs/fuse-t/fuse-t.log failure-logs/ 2>/dev/null || true

      - name: Upload the logs a failure leaves
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-e2e-logs-${{ matrix.platform }}
          path: failure-logs/
          retention-days: 7
