name: Deploy Landing Page to IPFS

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Pin to IPFS
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: landing/package-lock.json

      - name: Install and build
        working-directory: landing
        run: |
          npm ci
          npm run build

      - name: Upload dist to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: 'landing/dist/*'
          target: /tmp/cipherbox-landing
          strip_components: 2

      - name: Pin to IPFS via Kubo
        id: ipfs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ vars.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          capture_stdout: true
          script: |
            CID=$(ipfs add -Qr --pin /tmp/cipherbox-landing)
            rm -rf /tmp/cipherbox-landing
            echo "${CID}"

      - name: Validate CID
        run: |
          CID="${{ steps.ipfs.outputs.stdout }}"
          if [ -z "${CID}" ]; then
            echo "::error::No CID returned from IPFS pin step"
            exit 1
          fi
          echo "CID=${CID}" >> "$GITHUB_ENV"
          echo "Pinned landing page to IPFS: ${CID}"

      - name: Update DNSLink
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DNSLINK_RECORD_ID: ${{ secrets.DNSLINK_RECORD_ID }}
        run: |
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${DNSLINK_RECORD_ID}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"type\":\"TXT\",\"name\":\"_dnslink.cipherbox.cc\",\"content\":\"dnslink=/ipfs/${CID}\"}"

          echo "Updated DNSLink to /ipfs/${CID}"

      - name: Summary
        if: always()
        run: |
          echo "## Landing Page Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **CID:** ${CID}" >> $GITHUB_STEP_SUMMARY
          echo "- **IPFS Gateway:** https://ipfs.io/ipfs/${CID}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
