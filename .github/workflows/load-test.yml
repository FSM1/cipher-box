# The dispatch tier's load harness (blueprint/testing.md, blueprint/deploy.md).
# Never a PR gate: it is a load generator, and the only thing it can be pointed
# at is a loopback stack this job stands up, or staging behind the `staging`
# environment's approval. The harness crate's own unit tests block merges in
# CI's `Rust` area's `Workspace tests (Linux)` job. The weekly schedule runs
# `rotation-wave` on the runner-local stack only, so a rotation fault reaches
# the tracking issue.
name: Load Tests

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - staging
      scenario:
        description: 'Scenario'
        required: true
        default: 'mixed'
        type: choice
        options:
          - content-ingest
          - gateway-read
          - name-wave
          - mixed
          - byo-advisory
          - rotation-wave
      clients:
        description: 'Concurrent accounts (staging caps at 8)'
        required: false
        default: '5'
      ops_per_client:
        description: 'Iterations per account (staging caps at 50)'
        required: false
        default: '20'
      block_bytes:
        description: 'Upload block size in bytes, max 2 MiB'
        required: false
        default: '65536'
      batch_size:
        description: 'Registry batch size, max 1000'
        required: false
        default: '25'
      ramp_ms:
        description: 'Per-client start stagger in ms; 0 is a spike'
        required: false
        default: '0'
      nodes:
        description: 'Subfolders rotation-wave rotates, max 64; it runs one engine'
        required: false
        default: '16'

# Two runs against the same target would measure each other. Queue rather than
# cancel, so a staging run already loading the 2-vCPU box finishes cleanly. A
# staging run takes the group a deploy and the soak legs hold, so no load lands
# under either.
concurrency:
  group: ${{ inputs.environment == 'staging' && 'staging-environment' || 'load-test-local' }}
  cancel-in-progress: false

permissions: {}

jobs:
  load-test:
    name: "Load Test: ${{ inputs.scenario || 'rotation-wave' }} on ${{ inputs.environment || 'local' }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'staging' && 'staging' || '' }}
    # rotation-wave can wait out one idle sweep cadence (15 min) for its
    # sweep to converge.
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cipherbox_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      ipfs:
        image: ipfs/kubo:v0.42.0
        ports:
          - 5001:5001
          - 8080:8080
        options: >-
          --health-cmd "ipfs id"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    env:
      # A scheduled run has no inputs: it is the weekly rotation-wave run.
      SCENARIO: ${{ inputs.scenario || 'rotation-wave' }}
      CLIENTS: ${{ inputs.clients || '5' }}
      OPS_PER_CLIENT: ${{ inputs.ops_per_client || '20' }}
      BLOCK_BYTES: ${{ inputs.block_bytes || '65536' }}
      BATCH_SIZE: ${{ inputs.batch_size || '25' }}
      RAMP_MS: ${{ inputs.ramp_ms || '0' }}
      NODES: ${{ inputs.nodes || '16' }}
      TARGET: ${{ inputs.environment || 'local' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Its own key, not the `linux-cargo-` one `desktop-release.yml` also
          # writes: this job builds `crates/load` under `--release` over a
          # different graph, so a shared primary key makes each workflow
          # overwrite the other's `target/` and restore nothing reusable.
          key: load-test-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: load-test-cargo-

      - name: Install dependencies
        if: inputs.environment != 'staging'
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/mock-ipns-routing
        if: env.TARGET != 'staging' && env.SCENARIO == 'rotation-wave'

      - name: Stand up the local API over the CI stack
        if: inputs.environment != 'staging'
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: cipherbox_load
          NODE_ENV: test
          JWT_SECRET: load-harness-jwt-secret
          KUBO_API_URL: http://localhost:5001
          TEST_LOGIN_SECRET: load-harness-secret
          # A whole run provisions its accounts from one IP, so the per-IP auth
          # bucket would cap how many virtual clients can exist. Honored only on
          # an undeployed profile (apps/api/src/ops/throttling.ts).
          THROTTLE_AUTH_LIMIT: '500'
        run: |
          pnpm --filter @cipherbox/api migration:run
          pnpm --filter @cipherbox/api build
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          curl -fsS --retry 60 --retry-connrefused --retry-delay 1 http://localhost:3000/health \
            || { echo '--- API log ---'; cat /tmp/api.log; exit 1; }

      # The harness defaults its own loopback URLs, so a local run only needs
      # the shared test-login secret.
      - name: Resolve the target
        env:
          API_URL: ${{ vars.API_URL }}
          IPFS_GATEWAY_URL: ${{ vars.IPFS_GATEWAY_URL }}
          TEST_LOGIN_SECRET: ${{ secrets.TEST_LOGIN_SECRET }}
          IPFS_GATEWAY_TOKEN: ${{ secrets.IPFS_GATEWAY_TOKEN }}
        run: |
          if [ "$TARGET" = 'staging' ]; then
            if [ -z "$API_URL" ]; then
              echo '::error::staging runs need the API_URL variable'
              exit 1
            fi
            if [ "$SCENARIO" = 'rotation-wave' ]; then
              echo '::error::rotation-wave runs on the local target only'
              exit 1
            fi
            if [ -z "$TEST_LOGIN_SECRET" ]; then
              echo '::error::staging runs need the TEST_LOGIN_SECRET secret'
              exit 1
            fi
            if [ "$SCENARIO" = 'gateway-read' ]; then
              # The harness refuses a deployed target with no gateway URL, but only
              # after a release build; fail here instead.
              if [ -z "$IPFS_GATEWAY_URL" ]; then
                echo '::error::gateway-read on staging needs the IPFS_GATEWAY_URL variable'
                exit 1
              fi
              if [ -z "$IPFS_GATEWAY_TOKEN" ]; then
                echo '::error::gateway-read on staging needs the IPFS_GATEWAY_TOKEN secret; the read accelerator is behind forward_auth'
                exit 1
              fi
            fi
            echo "LOAD_TEST_API_URL=$API_URL" >> "$GITHUB_ENV"
            echo "LOAD_TEST_GATEWAY_URL=$IPFS_GATEWAY_URL" >> "$GITHUB_ENV"
            echo "LOAD_TEST_SECRET=$TEST_LOGIN_SECRET" >> "$GITHUB_ENV"
            echo "LOAD_TEST_GATEWAY_TOKEN=$IPFS_GATEWAY_TOKEN" >> "$GITHUB_ENV"
          else
            echo 'LOAD_TEST_SECRET=load-harness-secret' >> "$GITHUB_ENV"
          fi

      # The harness refuses a target the flags and the environment disagree
      # about: `local` only ever reaches loopback and `staging` only ever reaches
      # a non-loopback https URL, so a mis-dispatched run fails before it loads
      # anything. Bounds on clients/ops are enforced per target too.
      # rotation-wave runs one engine, so its numbers compare with
      # tools/perf/RESULTS.md; it takes the plan's default client count.
      - name: Run the load harness
        run: |
          clients=(--clients "$CLIENTS")
          if [ "$SCENARIO" = 'rotation-wave' ]; then
            clients=()
          fi
          cargo run --release -p cipherbox-load -- \
            --scenario "$SCENARIO" \
            --target "$TARGET" \
            "${clients[@]}" \
            --ops-per-client "$OPS_PER_CLIENT" \
            --block-bytes "$BLOCK_BYTES" \
            --batch-size "$BATCH_SIZE" \
            --ramp-ms "$RAMP_MS" \
            --nodes "$NODES"

      - name: Upload the metrics report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load-metrics-${{ env.SCENARIO }}-${{ env.TARGET }}
          path: load-reports/*.json
          retention-days: 30
          if-no-files-found: warn

  # A failed weekly run opens or updates one tracking issue, as a failed
  # nightly does.
  report:
    name: Report A Scheduled Load Failure
    needs: load-test
    if: ${{ github.event_name == 'schedule' && failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: 'ci: a scheduled load run failed'
        run: |
          set -euo pipefail
          {
            echo "Run: ${RUN_URL}"
            echo
            echo "| slot | result |"
            echo "| --- | --- |"
            echo "| Load Test: rotation-wave on local | failure |"
          } > "${RUNNER_TEMP}/load-report.md"
          number=$(gh issue list --state open --label comp:ci --limit 500 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body-file "${RUNNER_TEMP}/load-report.md"
          else
            gh issue create --title "${TITLE}" --label comp:ci \
              --body-file "${RUNNER_TEMP}/load-report.md"
          fi
