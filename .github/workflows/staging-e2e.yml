# The staging e2e suite (blueprint/testing.md, staging release gates): the v1
# usage profiles driven through a real browser against the deployed front, with
# the real wallet login a deployed bundle ships. It builds nothing — the bits
# under test are whatever the base URL serves — and it gates no merge, so a red
# run is the verdict on a deploy, never on a pull request.
name: Staging E2E

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: The deployed app to drive
        required: false
        default: https://app-staging.cipherbox.cc
        type: string
  workflow_call:
    inputs:
      base-url:
        description: The deployed app to drive
        required: false
        default: https://app-staging.cipherbox.cc
        type: string
      ref:
        description: 'Git ref to checkout for the suite sources'
        required: false
        type: string

permissions: {}

jobs:
  staging-e2e:
    name: Staging E2E (${{ matrix.project }})
    strategy:
      fail-fast: false
      # Separate retry windows, with one job at a time against staging.
      max-parallel: 1
      matrix:
        project: [staging, staging-link-first]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # The uploaded report and `test-results/` are public, and an ARIA snapshot
    # lists each link and field value on the page. This drops the page snapshot;
    # the strip step drops the snapshot a failed matcher writes.
    env:
      PLAYWRIGHT_NO_COPY_PROMPT: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/playwright-chromium
        with:
          package: '@cipherbox/web-e2e'
          working-directory: tests/web-e2e

      # One worker: staging is a 2-vCPU box, and its auth surface is rate
      # limited per caller address with no bypass.
      - name: Run the staging profiles
        timeout-minutes: 80
        run: pnpm --filter @cipherbox/web-e2e test:e2e --project=${{ matrix.project }}
        env:
          E2E_BASE_URL: ${{ inputs.base-url }}

      - name: Strip the ARIA snapshots from the Markdown error context
        id: strip
        if: always()
        working-directory: tests/web-e2e
        run: |
          set -euo pipefail
          dirs=()
          for dir in test-results playwright-report/data; do
            if [ -d "${dir}" ]; then dirs+=("${dir}"); fi
          done
          if [ "${#dirs[@]}" -eq 0 ]; then exit 0; fi
          find "${dirs[@]}" -type f -name '*.md' -exec perl -0pi -e 's/^```yaml\n.*?^```[ \t]*(?:\n|\z)//msg' {} +
          if grep -rl --include='*.md' '^```yaml' "${dirs[@]}"; then
            echo 'A fenced yaml block is still in the files above.' >&2
            exit 1
          fi

      - name: Upload the Playwright report and the measured timings
        if: always() && steps.strip.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-e2e-report-${{ matrix.project }}
          path: |
            tests/web-e2e/playwright-report/
            tests/web-e2e/test-results/
          retention-days: 14
