# The Web area of the PR gate (blueprint/testing.md): the browser host, the
# packages both hosts share, and the bundle that ships them. Called by ci.yml,
# which owns `Web Engine WASM` — the smoke slice consumes the same artifact and
# must not wait for this whole area.
name: CI Web

on:
  workflow_call:
    inputs:
      ts:
        description: The TypeScript path filter matched.
        required: true
        type: boolean
      web:
        description: The web path filter matched.
        required: true
        type: boolean
      rust:
        description: The Rust path filter matched.
        required: true
        type: boolean

permissions: {}

jobs:
  shared-packages:
    name: Shared packages typecheck + tests
    if: inputs.ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the type checker
        run: pnpm --filter @cipherbox/client --filter @cipherbox/login --filter @cipherbox/auth-ui run typecheck

      - name: Run the unit suites
        run: pnpm --filter @cipherbox/client --filter @cipherbox/login --filter @cipherbox/auth-ui run test

  web-host:
    name: Web host typecheck + tests
    if: inputs.ts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The smoke harness types itself against the `apps/web` source, which
      # reaches the shared packages through their published entries, so those
      # declarations must exist before the type checker runs.
      - name: Build the shared packages the harness reaches
        run: pnpm --filter @cipherbox/client --filter @cipherbox/login --filter @cipherbox/auth-ui run build

      - name: Run the type checker
        run: pnpm --filter @cipherbox/web --filter @cipherbox/web-e2e run typecheck

      - name: Run the host unit suite
        run: pnpm --filter @cipherbox/web run test

  # The bundle that fingerprints the engine artifact. It consumes the module
  # the caller's `Web Engine WASM` job produced, so it carries no Rust
  # toolchain at all: a failed engine build surfaces here as a failed download.
  bundle:
    name: Web Bundle
    if: inputs.web
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-engine-wasm
          path: apps/web/src/wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web bundle
        run: pnpm --filter @cipherbox/web run build:bundle

      - name: Bundle carries the fingerprinted engine artifact
        run: ls apps/web/dist/assets/cipherbox_wasm-*.js apps/web/dist/assets/cipherbox_wasm_bg-*.wasm

  # The packages/client browser suite (blueprint/testing.md law 1, "Host
  # suites"): the engine's per-seam conformance kits run against the real
  # browser seam implementations — IndexedDB, OPFS, fetch — in a real browser
  # (worker realm) driven by Playwright. The conformance-featured WASM module
  # bridges the JS seams to the engine's Rust kits (crates/wasm/src/conformance.rs).
  # Depends on both the crates and the packages, so it runs when either changed.
  client-browser:
    name: Client Browser Suite
    if: inputs.ts || inputs.rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: client-browser

      # wasm-bindgen-cli drives the conformance module build.
      - uses: ./.github/actions/wasm-bindgen-cli

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @cipherbox/client exec playwright install --with-deps chromium

      # `test:browser` builds the conformance WASM, typechecks the harness
      # against the freshly generated wasm-bindgen glue, then runs Playwright.
      # The harness typecheck lives here rather than in the typecheck job
      # because that glue only exists after the Rust build.
      - name: Typecheck harness + browser seam conformance suite
        run: pnpm --filter @cipherbox/client test:browser
