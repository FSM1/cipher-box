name: PR Release Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  # Do NOT cancel an in-flight preview run: a force-push/rebase that clobbers the
  # bot `chore(release): set release targets` commit must be able to self-heal by
  # letting the queued recompute finish (D-06 safety-net for T-53-04).
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-preview:
    name: Release Preview
    runs-on: ubuntu-latest
    # Skip release-please's own PRs — they don't need release labels
    if: "!startsWith(github.head_ref, 'release-please--')"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install script dependencies
        run: npm install --no-save --no-package-lock --ignore-scripts @actions/core@1.11.1 @actions/github@6.0.0

      - name: Analyze PR commits and apply release labels
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/pr-release-preview.js

      - name: Commit release-as targets
        if: >-
          steps.preview.outputs.config_changed == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-please-config.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(release): set release targets for PR #${PR_NUMBER}"
          git push
