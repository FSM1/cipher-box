name: Install Playwright Chromium
description: >-
  Install the Chromium build a Playwright suite pins, from a cache keyed on the
  version that suite resolves.

inputs:
  package:
    description: pnpm filter of the suite whose Playwright version this installs.
    required: true
  working-directory:
    description: Directory the pinned Playwright version is resolved from.
    required: true

runs:
  using: composite
  steps:
    # Playwright's own browser directory, chosen by runner rather than written
    # as one host's literal, so a second host leg costs nothing.
    - name: Resolve the browser directory
      id: browsers
      shell: bash
      run: |
        case "$RUNNER_OS" in
          macOS) DIR="$HOME/Library/Caches/ms-playwright" ;;
          Windows) DIR="$LOCALAPPDATA\\ms-playwright" ;;
          *) DIR="$HOME/.cache/ms-playwright" ;;
        esac
        echo "dir=${DIR}" >> "$GITHUB_OUTPUT"

    - name: Resolve the Playwright version
      id: playwright
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ${{ steps.browsers.outputs.dir }}
        key: playwright-browsers-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # The real Chrome headless, not `chrome-headless-shell`: the shell segfaults
    # on a page that registers a Service Worker, and the bundle registers one.
    #
    # `--with-deps` would bundle this download with an apt install, so a stall in
    # either is unattributable. A step timeout alone would not help either: it
    # kills the step, not the stalled attempt, so nothing retries.
    - name: Install Chromium
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        # coreutils' `timeout` answers to `gtimeout` on a macOS runner.
        TIMEOUT=$(command -v timeout || command -v gtimeout) || {
          echo "::error::neither timeout nor gtimeout is on PATH"
          exit 1
        }
        # The marker records the install's own status, so a stall is told apart
        # from the command exiting 124 on its own. `--kill-after` matters most:
        # without it `timeout` waits forever on a child that ignores SIGTERM,
        # which is the stall this step exists to bound.
        marker="$RUNNER_TEMP/playwright-browser-status"
        for attempt in 1 2 3; do
          rm -f "$marker"
          # shellcheck disable=SC2016  # the inner shell expands $1 and $2, not this one
          "$TIMEOUT" --kill-after=30 150 bash -c \
            'pnpm --filter "$2" exec playwright install chromium; echo "$?" > "$1"' _ "$marker" "$PACKAGE" || true
          if [ -f "$marker" ]; then
            install_status=$(cat "$marker")
            if [ "$install_status" -eq 0 ]; then
              exit 0
            fi
            echo "::error::playwright install chromium failed with status $install_status"
            exit "$install_status"
          fi
          echo "::warning::playwright install chromium stalled past 150s (attempt $attempt of 3)"
        done
        echo "::error::playwright install chromium stalled on every attempt"
        exit 1

    # The runner image already carries Chromium's shared libraries, so this is a
    # no-op on a healthy runner. It stays only to cover an image that drops one.
    #
    # So a stall here must not gate the suite: apt is bounded, never retried
    # (Playwright runs it under sudo, and a killed attempt leaves a root-owned
    # apt-get holding the dpkg lock that the next attempt dies on), and a failure
    # warns rather than fails. If a library really is missing, the suite says so
    # in the browser launch error.
    - name: Install the Playwright system dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
      run: |
        timeout --kill-after=30 240 \
          pnpm --filter "$PACKAGE" exec playwright install-deps chromium \
          || echo "::warning::playwright install-deps did not complete; the suite shows whether a library is actually missing"
