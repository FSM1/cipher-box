# zizmor configuration — scopes the CI security gate (.github/workflows/zizmor.yml)
# to the two supply-chain audits Phase 53 enforces:
#   - unpinned-uses     (every third-party action must be SHA-pinned — 53-01)
#   - excessive-permissions (every job runs with a least-privilege token — 53-02)
#
# All other zizmor audits are DEFERRED (not failures) by listing every workflow
# file under each audit's ignore. They flag pre-existing code smells outside the
# Phase 53 supply-chain remit; revisit in a dedicated hardening pass. unpinned-uses
# and excessive-permissions are intentionally NOT listed here, so the gate fails
# the build the moment either regresses.
rules:
  artipacked:
    # checkout persist-credentials hygiene — broad pre-existing finding (e.g. release-please.yml needs persist-credentials to push). Deferred: not in Phase 53 scope (supply-chain pinning + least-privilege only).
    ignore:
      - ci-e2e.yml
      - ci.yml
      - codecov-base.yml
      - deploy-landing.yml
      - deploy-staging.yml
      - desktop-e2e.yml
      - load-test.yml
      - pr-title.yml
      - release-please.yml
      - tag-staging.yml
      - web-e2e.yml
      - zizmor.yml
  template-injection:
    # github-context expansion in run: blocks — pre-existing across e2e/deploy workflows. Deferred: not Phase 53 scope.
    ignore:
      - ci-e2e.yml
      - ci.yml
      - codecov-base.yml
      - deploy-landing.yml
      - deploy-staging.yml
      - desktop-e2e.yml
      - desktop-release.yml
      - load-test.yml
      - pr-title.yml
      - release-please.yml
      - tag-staging.yml
      - web-e2e.yml
      - zizmor.yml
  cache-poisoning:
    # actions/cache restore-key hygiene — pre-existing. Deferred: not Phase 53 scope.
    ignore:
      - ci-e2e.yml
      - ci.yml
      - codecov-base.yml
      - deploy-landing.yml
      - deploy-staging.yml
      - desktop-e2e.yml
      - desktop-release.yml
      - load-test.yml
      - pr-title.yml
      - release-please.yml
      - tag-staging.yml
      - web-e2e.yml
      - zizmor.yml
  secrets-inherit:
    # reusable-workflow secrets: inherit — intentional for internal callers. Deferred: not Phase 53 scope.
    ignore:
      - ci-e2e.yml
      - ci.yml
      - codecov-base.yml
      - deploy-landing.yml
      - deploy-staging.yml
      - desktop-e2e.yml
      - desktop-release.yml
      - load-test.yml
      - pr-title.yml
      - release-please.yml
      - tag-staging.yml
      - web-e2e.yml
      - zizmor.yml
  github-app:
    # create-github-app-token blanket install perms in release-please.yml — inherent to the release bot design. Deferred: not Phase 53 scope.
    ignore:
      - ci-e2e.yml
      - ci.yml
      - codecov-base.yml
      - deploy-landing.yml
      - deploy-staging.yml
      - desktop-e2e.yml
      - desktop-release.yml
      - load-test.yml
      - pr-title.yml
      - release-please.yml
      - tag-staging.yml
      - web-e2e.yml
      - zizmor.yml
