services:
  - type: web
    runtime: static
    name: cipherbox-landing
    buildCommand: cd landing && corepack enable && pnpm install --ignore-workspace --frozen-lockfile && pnpm run build
    staticPublishPath: landing/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
