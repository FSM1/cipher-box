# CodeRabbit Configuration
# Documentation: https://docs.coderabbit.ai/guides/configure-coderabbit

language: en-US

reviews:
  # Enable automatic reviews on pull requests
  auto_review:
    enabled: true
    # Ignore drafts until ready for review
    drafts: false
    # Large PRs (e.g., package extractions) can exceed the default 150 file limit
    max_files_to_review: 300
    # Review based on changed files
    base_branches:
      - main

  # Review profile: chill (lenient) or assertive (strict)
  profile: chill

  # Request changes when issues are found
  request_changes_workflow: false

  # High-level summary in PR comments
  high_level_summary: true
  high_level_summary_placeholder: '@coderabbitai summary'

  # Generate poem in review (fun feature, can disable)
  poem: false

  # Review walkthrough
  review_status: true
  collapse_walkthrough: false

  # Path-based instructions for specific areas
  path_instructions:
    - path: 'apps/api/**'
      instructions: |
        This is the NestJS backend API. Focus on:
        - Security vulnerabilities and input validation
        - Proper error handling
        - Database query efficiency
        - API contract consistency with OpenAPI spec

    - path: 'apps/web/**'
      instructions: |
        This is the React frontend. Focus on:
        - Component reusability and React best practices
        - Accessibility (a11y) concerns
        - Performance optimizations
        - Type safety with TypeScript

    - path: 'crates/**'
      instructions: |
        Rust core: all codec, crypto, and engine logic lives here (the
        blueprint corpus in blueprint/ is normative). Focus on:
        - Security best practices for cryptographic operations
        - Proper key handling, zeroization at the terminal owner only
        - Determinism: entropy/time/policy must enter via parameters or
          seam traits, never direct clock/RNG calls

    - path: '**/*.test.ts'
      instructions: |
        Focus on test coverage, edge cases, and test quality.
        Ensure tests are meaningful and not just for coverage metrics.

    - path: '**/*.md'
      instructions: |
        Markdown files are documentation and learnings. Use them for context
        when reviewing related code, but do NOT flag markdown formatting,
        linting, or style issues (these are handled by markdownlint).

  # Paths to ignore in reviews
  path_filters:
    - '!**/node_modules/**'
    - '!**/dist/**'
    - '!**/build/**'
    - '!**/.next/**'
    - '!**/coverage/**'
    - '!**/pnpm-lock.yaml'
    - '!**/generated/**'
    - '!packages/api-client/**'
    - '!apps/web/src/api/**'
    - '!.claude/agents/**'
    - '!.claude/commands/**'
    - '!.claude/get-shit-done/**'
    - '!**/*.pen'

chat:
  # Enable chat interactions in PR comments
  auto_reply: true

# Early access features
early_access: false
