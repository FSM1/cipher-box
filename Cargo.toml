# CipherBox v2 Rust workspace.
# All crates are unpublished implementation detail, version-frozen at 0.0.0
# per blueprint/deploy.md — releases never touch Cargo.toml/Cargo.lock.

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/engine",
    "crates/wasm",
    "crates/fuse",
    "crates/desktop-seams",
    "crates/contract",
    "crates/load",
    "apps/desktop/src-tauri",
    # Vendored third-party source, a member so it shares the one lockfile; the
    # cargo jobs exclude it by name (blueprint/testing.md).
    "third-party/fuser",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/FSM1/cipher-box"
rust-version = "1.88"
publish = false

[workspace.dependencies]
cipherbox-core = { path = "crates/core" }
cipherbox-desktop-seams = { path = "crates/desktop-seams" }
cipherbox-engine = { path = "crates/engine" }
base64 = "0.22"
# The dispatch-tier profiling harness only. default-features are stripped to
# keep plotters/rayon out of the dev graph — the numbers are read from
# criterion's own estimates, never from generated HTML.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
futures-channel = "0.3"
getrandom = "0.3"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
