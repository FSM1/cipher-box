# Vendored fuser 0.16.0 (MIT, https://github.com/cberner/fuser), carrying the
# CipherBox socket-read patch: FUSE-T speaks FUSE over a Unix socket that
# fragments messages, and stock fuser assumes one read() yields one message
# (`src/channel.rs`, and the regression test beside it).
#
# It also carries the two-lifetime entry patch: `fuse_entry_out` times the name
# binding and the attributes in separate fields, and upstream's `ReplyEntry::entry`
# and `ReplyCreate::created` collapsed both onto one `Duration`, which zeroed the
# name cache of any mount that suppresses only its attribute one (`src/reply.rs`,
# `src/ll/reply.rs`, and the encoder tests beside them). The patch also reorders
# `Response::new_entry`'s two `Duration` parameters to `(entry_ttl, attr_ttl)`,
# matching `new_create` and the callers: upstream declared them the other way
# around, which is invisible while both carry one value and silently swaps the
# wire fields once they differ.
#
# It also carries the name-redaction patch: the default `Filesystem` bodies and
# the `Display` impls for `Operation`, `AnyRequest` and `FilenameInDir` rendered
# the caller's name, which in this product is user plaintext. Every such site
# now formats the name through `redacted` (`src/redact.rs`), which renders a
# byte length only. That module is the single definition a re-vendor re-applies,
# and the tests in `src/lib_impl.rs` and `src/ll/request.rs` assert no name
# reaches a log record or a render. `Operation` and `AnyRequest` also lose their
# derived `Debug`, which printed the raw name and the raw argument bytes; both
# now delegate to the redacted `Display`.
#
# Trimmed against upstream: the examples, the mount-requiring integration
# tests, and their dev-dependencies are gone — this is a library the product
# links, not a crate under development here. Every dependency is scoped to
# `cfg(unix)` because the crate body is: on Windows `lib.rs` compiles empty.
#
# The libfuse2 mount path (`src/mnt/fuse2.rs`) carries two lint fixes on top of
# upstream: it is the path FUSE-T links, so it compiles for the first time with
# the macOS adapter, and the pinned toolchain's clippy refuses it as-shipped.
# `option_to_string` is re-exported for the same reason: the product enforces
# its mount floor on the string the mount program receives, and `Session::new`
# runs no option check of its own.
#
# A workspace member, so it resolves through the one root `Cargo.lock` the
# product links — a second lockfile would drift and the socket-read patch's
# regression test would then run against a graph nothing ships. The general
# cargo jobs exclude it by name because its build script refuses a non-Linux
# target without libfuse and its one upstream mount test needs a kernel; the
# Linux clippy job selects it, so a re-vendor has to land lint-clean against
# the pinned toolchain.
[package]
edition = "2024"
rust-version = "1.88"
name = "fuser"
version = "0.16.0"
authors = ["Christopher Berner <me@cberner.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Filesystem in Userspace (FUSE) for Rust"
homepage = "https://github.com/cberner/fuser"
documentation = "https://docs.rs/fuser"
readme = "README.md"
keywords = [
    "fuse",
    "filesystem",
    "system",
    "bindings",
]
categories = [
    "external-ffi-bindings",
    "api-bindings",
    "filesystem",
    "os::unix-apis",
]
license = "MIT"
repository = "https://github.com/cberner/fuser"
publish = false

[features]
abi-7-19 = []
abi-7-20 = ["abi-7-19"]
abi-7-21 = ["abi-7-20"]
abi-7-22 = ["abi-7-21"]
abi-7-23 = ["abi-7-22"]
abi-7-24 = ["abi-7-23"]
abi-7-25 = ["abi-7-24"]
abi-7-26 = ["abi-7-25"]
abi-7-27 = ["abi-7-26"]
abi-7-28 = ["abi-7-27"]
abi-7-29 = ["abi-7-28"]
abi-7-30 = ["abi-7-29"]
abi-7-31 = ["abi-7-30"]
abi-7-36 = ["abi-7-31"]
abi-7-40 = [
    "abi-7-36",
    "nix/ioctl",
]
default = []
libfuse = ["pkg-config"]
macfuse-4-compat = []
serializable = ["serde"]

[lib]
name = "fuser"
path = "src/lib.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2.51"
log = "0.4.6"
memchr = "2.7.2"
nix = { version = "0.29.0", features = ["fs", "user"] }
page_size = "0.6.0"
serde = { version = "1.0.102", features = ["std", "derive"], optional = true }
smallvec = "1.6.1"
# CipherBox patch: the reused request buffer holds write plaintext.
zeroize = "1"
zerocopy = { version = "0.8", features = ["derive"] }

[target.'cfg(unix)'.dev-dependencies]
# The mount-option unit tests want a throwaway directory.
tempfile = "3"

[target.'cfg(unix)'.build-dependencies]
pkg-config = { version = "0.3.14", optional = true }
