# Standalone workspace on purpose: the hardware gates are
# task-shaped, run-by-hand tools — not CI, not part of the frozen product
# workspace, so the root Cargo.lock never moves for them.
[workspace]

[package]
name = "hw-gates"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
pkg-config = "0.3"

[dependencies]
# The one vendored copy of the socket-read-patched fuser, which now lives in
# the product workspace (`third-party/fuser`) — the gates link the same crate
# the Linux adapter does.
fuser = { path = "../../third-party/fuser", default-features = false, features = [
    "libfuse",
] }
libc = "0.2"
