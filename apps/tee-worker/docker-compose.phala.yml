# Phala Cloud CVM deployment configuration
# Deploy: phala deploy -c docker-compose.phala.yml -n cipherbox-tee-staging --wait
#
# CRITICAL: Always UPDATE the existing CVM (via phala deploy with same name).
# Never delete and recreate -- app_id changes would invalidate all epoch keys.
services:
  tee-worker:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/cipherbox-tee-worker:${TAG:-latest}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - '3001:3001'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - TEE_MODE=cvm
      - CIPHERBOX_ENVIRONMENT=staging
      - TEE_WORKER_SECRET=${TEE_WORKER_SECRET}
