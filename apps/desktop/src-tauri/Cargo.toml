# CipherBox desktop shell — Tauri v2 tray, window chrome, and the two native
# login steps (loopback OAuth callback, the facade over IPC).
# Version-frozen at 0.0.0 like every workspace crate; the product version
# lives in tauri.conf.json.

[package]
name = "cipherbox-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
# Minisign-verified updates over the one GitHub release stream; the key it
# verifies against is `plugins.updater.pubkey` in tauri.conf.json.
tauri-plugin-updater = "2"
# Parked writes reach the member as a system notification, edge-triggered so a
# dead letter that keeps reporting is announced once.
tauri-plugin-notification = "2"
# The engine this shell hosts, and the seam set it is constructed over.
cipherbox-engine.workspace = true
cipherbox-desktop-seams.workspace = true
# The loopback OAuth callback: a listener, a task per connection so no peer can
# starve the exchange, its request decode, and the deadlines that bound it.
# Tauri's own async runtime is Tokio.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
serde.workspace = true
serde_json.workspace = true
# Decodes the ID token payload to read its `nonce` claim. The API verifies the
# token's signature; this shell only binds it to the exchange it answers.
base64.workspace = true
# Nonces for the OAuth exchange. The engine's injected-entropy law is about
# engine logic; this is host-side and never derives a key.
getrandom.workspace = true
zeroize.workspace = true

# The filesystem the engine is projected through. A platform with no host
# adapter runs the session with no mount (`src/mount/detached.rs`).
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
cipherbox-fuse.workspace = true

[dev-dependencies]
# The callback listener is exercised over a real loopback socket.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }
# The session loop is driven over a hand-fed event stream, so what a burst of
# events costs the window is asserted rather than timed.
cipherbox-engine = { workspace = true, features = ["test-kit"] }
# The engine host's tests open its real file stores under a temp root, and the
# mount-point tests prepare one under a throwaway home.
tempfile = "3"
