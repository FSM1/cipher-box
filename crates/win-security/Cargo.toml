# The one place the Windows mount needs `unsafe`, held apart from the
# projection that forbids it (`crates/fuse` is `#![forbid(unsafe_code)]`).
#
# Two operations, both pure FFI shape: reading the mounting user's SID out of
# the process token, and copying a finished security descriptor into the
# out-buffer WinFsp hands the filesystem as `&mut [c_void]`. Nothing here knows
# what a security descriptor means — that is assembled in safe Rust by the
# adapter, and tested there.
[package]
name = "cipherbox-win-security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }
