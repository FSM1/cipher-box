# The one place the Windows mount needs `unsafe`, held apart from the
# projection that forbids it (`crates/fuse` is `#![forbid(unsafe_code)]`).
# What it carries and why is in `src/lib.rs`.
[package]
name = "cipherbox-win-security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }
