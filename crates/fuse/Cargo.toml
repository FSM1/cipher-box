[package]
name = "cipherbox-fuse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
# Reads FUSE-T's libdir back out of `fuse-t.pc` for the macOS rpath.
pkg-config = "0.3"

[target.'cfg(windows)'.build-dependencies]
# WinFsp is only ever delay-loaded, and the `/DELAYLOAD` link arg that makes it
# so does not cross a dependency's build script — every package that links the
# adapter states it, this one for its own test binaries. The feature set matches
# the runtime dependency's exactly, so `winfsp-sys` is built once rather than
# twice under the v2 resolver's split feature graphs.
winfsp = { version = "0.12", default-features = false, features = [
  "notify",
  "delayload",
  "system",
] }

[features]
# Compiles the seam constructor the vfs suite drives the spill area through.
# Never enabled in a production build: it is activated only by this crate's own
# dev-dependency (below), exactly like the engine's `test-kit`.
test-kit = []

[dependencies]
# The spill file seals its blocks with core's AEAD.
cipherbox-core.workspace = true
cipherbox-engine.workspace = true
zeroize.workspace = true
# The spill's per-handle sealing key is drawn here, at the production mount's
# own construction site — see `SpillArea::production`.
getrandom.workspace = true

# The spill area's lease: one exclusive OS file lock, `flock` on unix and
# `LockFileEx` on Windows, without the `unsafe` this crate forbids.
fs4 = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# errno constants for the shared VfsError mapping, which every unix mount
# technology answers its kernel from.
libc = "0.2"

# Both FUSE backends — libfuse3 on Linux, FUSE-T's libfuse2 shim on macOS —
# speak the FUSE wire through the one vendored `fuser`, so the session plumbing
# they share is built for both.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The session thread hands operations to the engine task over these —
# runtime-agnostic, matching the engine's own event stream.
futures-channel.workspace = true
futures-core.workspace = true
# The mount's own uid/gid, without `unsafe` — the crate forbids it. Same
# version fuser already resolves, so this costs no extra tree.
nix = { version = "0.29", features = ["user"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The one vendored copy, carrying the socket-read patch (blueprint/desktop.md
# "Backends"). Default features select the pure-Rust `fusermount3` mount path,
# so building the adapter needs no libfuse3 headers.
fuser = { path = "../../third-party/fuser", default-features = false }

[target.'cfg(windows)'.dependencies]
# WinFsp's user-mode filesystem host, through winfsp-rs — the only mount
# technology Windows has (blueprint/desktop.md "Backends"). Both are GPLv3;
# what that means for the combined work is in `docs/ATTRIBUTION.md`.
#
# `system` resolves WinFsp through `HKLM\SOFTWARE\WOW6432Node\WinFsp\InstallDir`
# — the headers and import library at build time, the DLL at `winfsp_init` — so
# the mount links against the driver the MSI actually installed rather than a
# vendored copy. `notify` is the push-invalidation path; `delayload` matches the
# build dependency's feature set.
winfsp = { version = "0.12", default-features = false, features = [
  "notify",
  "delayload",
  "system",
] }
# The session thread hands operations to the engine task over these — the same
# channel the FUSE backends use, so both adapters wait the same way.
futures-channel.workspace = true
futures-core.workspace = true
# WinFsp speaks UTF-16 at every name-bearing edge; the engine stores UTF-8.
widestring = "1"
# The Windows FFI shapes this crate cannot express, because it forbids
# `unsafe`. The descriptor itself is assembled here, in safe Rust.
cipherbox-win-security = { path = "../win-security" }

[target.'cfg(target_os = "macos")'.dependencies]
# The pure-Rust mount path is `fusermount3`, Linux only, so macOS links a
# libfuse ABI: the vendored build script probes `fuse-t.pc` ahead of `fuse.pc`
# so FUSE-T wins over macFUSE whenever both are installed (blueprint/desktop.md
# "Backends" — macFUSE stays rejected).
fuser = { path = "../../third-party/fuser", default-features = false, features = [
  "libfuse",
] }

[dev-dependencies]
# Self dev-dependency enables `test-kit` for this crate's own tests without
# leaking it into a consumer's production build.
cipherbox-fuse = { path = ".", features = ["test-kit"] }
# The vfs suite drives a real engine over the in-memory seam fakes and the
# virtual clock — no kernel, no network, no wall clock.
cipherbox-engine = { workspace = true, features = ["test-kit"] }
# Spill files are real files; the suite gives each mount a throwaway dir.
tempfile = "3"
