[package]
name = "cipherbox-fuse"
version = "0.11.0"
edition = "2021"
description = "CipherBox FUSE filesystem with platform-specific mount implementations"

[features]
default = ["fuse"]
fuse = ["dep:fuser", "dep:unicode-normalization"]
winfsp = ["dep:winfsp", "dep:widestring"]

[dependencies]
cipherbox-crypto = { workspace = true }
cipherbox-core = { workspace = true }
cipherbox-api-client = { workspace = true }
cipherbox-sdk = { workspace = true }

# Platform-agnostic
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
zeroize = { workspace = true }
log = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
ed25519-dalek = { workspace = true }

# Platform-specific (Unix FUSE) - optional, activated by "fuse" feature
fuser = { version = "0.16", default-features = false, features = ["libfuse"], optional = true }
unicode-normalization = { workspace = true, optional = true }

# Platform-specific (Windows)
winfsp = { version = "0.12", optional = true, features = ["system"] }
widestring = { version = "1", optional = true }

[dev-dependencies]
ecies = { workspace = true }
ciborium = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
