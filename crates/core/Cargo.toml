[package]
name = "cipherbox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Pure-Rust RustCrypto / dalek-family primitives only (blueprint/core.md
# "Crypto suite"): no OpenSSL/ring, no getrandom entropy path — entropy enters
# as explicit parameters (blueprint/core.md "Doctrine"). default-features are
# stripped to keep the getrandom/std entropy backends out of the tree; the KAT
# suite compiles for wasm32-wasip1 unchanged.
blake3 = { version = "1", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Pulled in directly (x25519-dalek already depends on it) for the prime-order-
# subgroup check on X25519 public keys: `is_torsion_free` is Edwards-side and
# x25519-dalek re-exports nothing that reaches it.
curve25519-dalek = { version = "4", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
hkdf = { version = "0.12", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha2 = { version = "0.10", default-features = false }
subtle = { version = "2", default-features = false }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The KAT suite is the WASM residual parity surface (blueprint/core.md): the
# same tests compile for wasm32-wasip1, where proptest's process-fork
# machinery (rusty-fork/wait-timeout) cannot build.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = "1"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

# The browser-shaped WASM leg (wasm32-unknown-unknown). Unlike wasm32-wasip1,
# it lacks a native libtest harness, so the KAT + property tests run under
# wasm-bindgen-test (see the `#[test]` shadow in the test files). getrandom's
# `wasm_js` backend gives proptest's RNG `crypto.getRandomValues` — the
# getrandom parity surface (blueprint/core.md); the backend is selected by the
# `getrandom_backend="wasm_js"` cfg in `.cargo/config.toml`.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
