[package]
name = "cipherbox-load"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# The dispatch-tier load harness (blueprint/testing.md, Dispatch / scheduled).
# It drives the engine's real API client over the desktop `Http` seam, so a run
# measures the shipping client path.

[[bin]]
name = "cipherbox-load"
path = "src/main.rs"

[dependencies]
cipherbox-core.workspace = true
cipherbox-desktop-seams.workspace = true
cipherbox-engine.workspace = true
# Same ring-backed rustls pin as the seam crate (no OpenSSL, no aws-lc/cmake);
# used only to build the shared client the harness hands to `ReqwestHttp`.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
tokio = { version = "1", features = ["rt", "net", "time"] }
getrandom = "0.2"
serde_json.workspace = true
zeroize.workspace = true
