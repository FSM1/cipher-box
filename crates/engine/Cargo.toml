[package]
name = "cipherbox-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Compiles the `testkit` module: in-memory seam fakes, seeded entropy, the
# virtual-clock scheduler, and the per-seam conformance kits. Host crates
# enable it from dev-dependencies to run the kits against their real seam
# implementations; production builds never compile it.
test-kit = []

[dependencies]
base64.workspace = true
cipherbox-core.workspace = true
futures-channel.workspace = true
futures-core.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Self dev-dependency: enables `test-kit` for this crate's own tests (unit,
# integration, doc) without leaking it into downstream production builds.
cipherbox-engine = { workspace = true, features = ["test-kit"] }
# The KAT generator and suite encode vector bytes as lowercase hex.
hex = "0.4"
# Integration tests construct real signed/sealed records with core's crypto to
# hand-feed the adoption-gate simulation harness (core is already a normal
# dependency; this line makes it addressable from `tests/`).
cipherbox-core.workspace = true
# Same reason: `RecordSeal` takes a zeroizing ephemeral scalar, so a test that
# stages an op directly needs the type addressable from `tests/`.
zeroize.workspace = true

# Per-stage profiling, run only from the dispatch-tier Perf Benches workflow.
# `cargo clippy/check --all-targets` still compiles it, so the bench cannot rot
# unnoticed; `test = false` keeps a local `--all-targets` test run from
# executing criterion in its test mode.
[[bench]]
name = "pipeline"
harness = false
test = false

# Scoped away from wasm the way core's is: criterion has no wasm build, and
# cargo `--extern`s every dev-dependency into every test unit whether or not it
# is used, so an unscoped one would break the day this crate gains a wasm test
# leg.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion.workspace = true
