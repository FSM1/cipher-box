coverage:
  status:
    project:
      default:
        target: auto
        threshold: 6%
        flags:
          - api
          - crypto
          - core
          - api-client
          - sdk-core
          - sdk
      api:
        paths:
          - apps/api/src/**
        target: 85%
        threshold: 2%
        flags:
          - api
      crypto:
        paths:
          - packages/crypto/src/**
        target: 80%
        threshold: 2%
        flags:
          - crypto
      core:
        paths:
          - packages/core/src/**
        target: 75%
        threshold: 3%
        flags:
          - core
      api-client:
        paths:
          - packages/api-client/src/**
        target: 70%
        threshold: 5%
        informational: true
        flags:
          - api-client
      sdk-core:
        paths:
          - packages/sdk-core/src/**
        target: 80%
        threshold: 2%
        flags:
          - sdk-core
      sdk:
        paths:
          - packages/sdk/src/**
        target: 68%
        threshold: 3%
        flags:
          - sdk
      desktop:
        paths:
          - apps/desktop/src-tauri/src/**
        target: auto
        threshold: 5%
        informational: true
        flags:
          - desktop
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: true

flags:
  api:
    paths:
      - apps/api/src/**
    carryforward: true
  crypto:
    paths:
      - packages/crypto/src/**
    carryforward: true
  core:
    paths:
      - packages/core/src/**
    carryforward: true
  api-client:
    paths:
      - packages/api-client/src/**
    carryforward: true
  sdk-core:
    paths:
      - packages/sdk-core/src/**
    carryforward: true
  sdk:
    paths:
      - packages/sdk/src/**
    carryforward: true
  desktop:
    paths:
      - apps/desktop/src-tauri/src/**
    carryforward: true

comment:
  layout: 'reach,diff,flags,files'
  behavior: default
  require_changes: true
