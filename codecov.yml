# v2 coverage policy (blueprint/testing.md): no line-coverage thresholds as
# merge gates — codecov is informational reporting only. The structural merge
# gates live in named CI jobs instead. Flags return as the v2 suites land
# and start uploading.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 100%
        informational: true
    patch:
      default:
        target: auto
        threshold: 100%
        informational: true

comment:
  layout: 'reach,diff,flags,files'
  behavior: default
  require_changes: true
